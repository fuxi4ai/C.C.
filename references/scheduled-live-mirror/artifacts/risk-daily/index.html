@keyframes glowPulse{0%,100%{box-shadow:var(--whisper),inset 0 0 0 1px rgba(255,255,255,.42),0 0 10px -3px var(--glow)}

/* === 传导图·小卡+连线（借鉴 Global Asset Inventory）=== */
.board{position:relative;margin-top:6px}
#links{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:visible}
.rrow{position:relative;z-index:1;margin-bottom:36px}

.rcards{display:grid;grid-template-columns:repeat(auto-fill,188px);gap:11px;grid-auto-rows:1fr}  /* grid 等高（2026-07-30 v2）：每容器内所有卡取最高卡高度·无硬编码像素——修「议息卡换行后与首行不等高」且不垫高全板（v1 的 min-height:128px 撤销） */
.scard{position:relative;width:188px;padding:13px 15px;overflow:hidden;border-radius:15px;cursor:pointer;

 box-shadow:var(--whisper),inset 0 0 0 1px rgba(255,255,255,.42);
 transition:transform .16s,box-shadow .16s,border-color .16s,opacity .16s}
.scard::after{content:"";position:absolute;left:0;right:0;top:0;height:32%;border-radius:14px 14px 0 0;background:linear-gradient(180deg,rgba(255,255,255,.44),transparent 90%);pointer-events:none;z-index:2}
.scard:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--sc,#888) 45%,var(--line));box-shadow:var(--whisper),0 7px 22px rgba(20,20,19,.10),inset 0 0 0 1px rgba(255,255,255,.55),0 0 16px -3px color-mix(in srgb,var(--glow,var(--sc,#888)) 90%,transparent)}

/* 已触发风险卡·红色呼吸外发光（Doctor 2026-08-14 批·「另给逻辑」落地：页脚图例「红＝触发·急脉」归位；2.2s 稳呼吸·reduced-motion 豁免） */
.scard[data-trig="fired"]{animation:scardGlow 2.2s ease-in-out infinite}
@keyframes scardGlow{0%,100%{box-shadow:var(--whisper),inset 0 0 0 1px rgba(255,255,255,.42),0 0 7px -2px rgba(192,57,43,.5)}
 50%{box-shadow:var(--whisper),inset 0 0 0 1px rgba(255,255,255,.42),0 0 18px 1px rgba(192,57,43,.78),0 0 34px 5px rgba(192,57,43,.38)}}
@media (prefers-reduced-motion:reduce){.scard[data-trig="fired"]{animation:none}}
.scard[data-trig="none"]{opacity:.5}  /* 无临近风险卡半透50%（Doctor 2026-08-11）：仅降不透明度，颜色/发光/徽章/呼吸特效全保留；须置于.dim前，hover聚焦(.2)仍可压过 */
.scard.dim{opacity:.2}
.scard.cmp-c{border-style:dashed;border-color:#cbba9a}

.scard .snm{font-size:13.5px;font-weight:600;line-height:1.28;margin-bottom:4px}
.scard .ssum{font-size:10.5px;color:#6b6a64;line-height:1.42;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.scard{padding-bottom:42px}  /* 给底部绝对定位的 srow 留位（2026-07-27 起化合物卡也有剂量灯行；2026-07-28 38→42px 容 strig 两行）*/
.scard .srow{position:absolute;left:15px;right:15px;bottom:11px;z-index:1;display:flex;align-items:flex-end;justify-content:space-between}
.scard .svL{display:flex;align-items:center;gap:7px}
.scard .ledbar{display:inline-flex;gap:2.5px;align-items:center}
.scard .led{width:5px;height:15px;border-radius:2px}
.scard .slabel{font-size:9.5px;color:#8a8578;font-weight:600;letter-spacing:.04em}

.scard .sden{font-size:11px;color:#8a8578;font-weight:600;margin-left:-2px;align-self:baseline}
.scard .sbd{font-size:11px;font-weight:700}
.scard .strig{font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right;line-height:1.25;max-width:97px}
/* 2026-07-28：去 white-space:nowrap 改允许换行。卡宽 188 − padding 30 = 158px，左侧杀伤灯组约 61px，
   右下角硬上限 ~97px（11px 中文约 8 字）。超出者折两行、右对齐、与杀伤灯底部对齐（srow align-items:flex-end）。 */
.scard .p1{font-size:10px;color:var(--amber);margin-top:3px}
/* 左上角浮层「危/烈」· 字酷堂石刻体 · 半出卡外半压卡 · 呼吸+外发光。危=触发红(fired)·烈=烈度红·并存危在前(左·left内联) */
.scard.danger{overflow:visible;z-index:5}
.scard.badged{overflow:visible;z-index:4}  /* 有石刻浮层即放开裁切（修「退」在非 danger 卡被裁·2026-07-27）；styleguide §04 同款 */
.dz-badge{position:absolute;top:-9px;z-index:6;transform-origin:center;font-family:"字酷堂石刻体","ZKingKongShiKe","STKaiti","KaiTi","Source Han Serif SC","Songti SC",serif;font-size:24px;font-weight:700;color:#c0392b;line-height:1;pointer-events:none;animation:dzBreath 1.9s ease-in-out infinite}
@keyframes dzBreath{0%,100%{opacity:.74;transform:scale(1);text-shadow:0 0 4px rgba(192,57,43,.55),0 0 8px rgba(192,57,43,.35),1px 1px 2px rgba(0,0,0,.3)}50%{opacity:1;transform:scale(1.12);text-shadow:0 0 7px rgba(192,57,43,1),0 0 15px rgba(192,57,43,.72),0 0 26px rgba(192,57,43,.45),1px 1px 2px rgba(0,0,0,.3)}}
@media (prefers-reduced-motion:reduce){.dz-badge{animation:none;text-shadow:0 0 8px rgba(192,57,43,.8),1px 1px 2px rgba(0,0,0,.3)}}
.dz-badge.warn{color:#e0791e;animation-name:dzBreathOrange}  /* 兆=传导预警·橘 */
@keyframes dzBreathOrange{0%,100%{opacity:.74;transform:scale(1);text-shadow:0 0 4px rgba(224,121,30,.55),0 0 8px rgba(224,121,30,.35),1px 1px 2px rgba(0,0,0,.3)}50%{opacity:1;transform:scale(1.12);text-shadow:0 0 7px rgba(224,121,30,1),0 0 15px rgba(224,121,30,.72),0 0 26px rgba(224,121,30,.45),1px 1px 2px rgba(0,0,0,.3)}}
@media (prefers-reduced-motion:reduce){.dz-badge.warn{animation:none;text-shadow:0 0 8px rgba(224,121,30,.85),1px 1px 2px rgba(0,0,0,.3)}}
.dz-badge.still{animation:none;opacity:1;transform:none;text-shadow:0 0 5px rgba(192,57,43,.9),0 0 11px rgba(192,57,43,.5),1px 1px 2px rgba(0,0,0,.3)}  /* 烈:静态红发光·无呼吸 */
.dz-badge.warn.still{text-shadow:0 0 5px rgba(224,121,30,.9),0 0 11px rgba(224,121,30,.5),1px 1px 2px rgba(0,0,0,.3)}  /* 兆:静态橘发光·无呼吸 */
.dz-badge.ebb{color:#2f8f86;animation:none;opacity:1;transform:none;text-shadow:0 0 5px rgba(47,143,134,.9),0 0 11px rgba(47,143,134,.5),1px 1px 2px rgba(0,0,0,.3)}  /* 退:风险退潮青·静态发光·无呼吸（Doctor 2026-07-27·守「只有危呼吸」铁律） */
.dz-ecg{position:absolute;top:-9px;right:-6px;z-index:6;color:#2aa79b;pointer-events:none;filter:drop-shadow(0 0 4px rgba(42,167,155,.85)) drop-shadow(0 0 9px rgba(42,167,155,.45)) drop-shadow(1px 1px 2px rgba(0,0,0,.3))}  /* 心电图＝剧烈标（震动≥60·无方向·非利空）·青碧·右上半出卡外·视觉范式同危·静态发光守「只有危呼吸」（Doctor 2026-07-28） */
/* 详情页折叠（2026-07-30 Doctor：结论常显·小三角收详解·默认折叠） */
.dsec details.fold{margin-top:6px}

/* === 二级详情页（点击卡片弹出）=== */
.dov{position:fixed;inset:0;background:rgba(20,20,19,.42);display:flex;align-items:center;justify-content:center;z-index:200;padding:24px}
.dov[hidden]{display:none}

.dsec .db.mono{font-family:var(--zh);font-size:11.5px;color:#6b6a64;word-break:break-all}  /* 信号来源等小字改思源宋体（Doctor 2026-07-27·原 var(--mono)） */
.dchips{display:flex;flex-wrap:wrap;gap:6px}

ar(--mono);font-size:15px;color:var(--ink3);text-align:center;width:34px}\n  .rank.top{color:var(--amber)}\n  .rname{font-weight:600;font-size:13.5px}\n  .rwindow{color:var(--ink3);font-size:11px;margin-top:2px}\n  .rnote{color:var(--ink2);font-size:11px;margin-top:3px;max-width:340px;line-height:1.4}\n  .axis{font-family:var(--mono);text-align:center;color:var(--ink2);width:34px;font-size:12.5px}\n  .score-cell{width:150px;padding-left:12px}\n  .score-num{font-family:var(--mono);font-size:19px;font-weight:700;line-height:1}\n  .bar{height:5px;border-radius:3px;margin-top:5px;background:var(--line);overflow:hidden}\n  .bar>i{display:block;height:100%;border-radius:3px;transition:width .45s ease}\n  .legend{font-size:11px;color:var(--ink3);margin-top:12px;line-height:1.6}\n  .legend b{color:var(--ink2)}\n  /* scatter */\n  .scatter-wrap{position:relative}\n  svg{width:100%;height:auto;display:block}\n  .q-label{font-size:10.5px;fill:var(--ink3);font-family:var(--sans)}\n  .ax-label{font-size:11px;fill:var(--ink2);font-family:var(--sans)}\n  .grid-line{stroke:var(--line);stroke-width:1}\n  .div-line{stroke:#463c2e;stroke-width:1;stroke-dasharray:4 4}\n  .pt-label{font-size:11px;fill:var(--ink);font-family:var(--sans);font-weight:600}\n  .pt-score{font-family:var(--mono);font-size:10px;font-weight:700}\n  circle.pt{transition:cy .45s cubic-bezier(.4,0,.2,1),r .3s ease,fill .3s ease;cursor:default}\n  .foot{color:var(--ink3);font-size:11px;margin-top:18px;line-height:1.6}\n  .foot a{color:var(--amber-soft)}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n  <header>\n    <h1>AI 科技股 · 警报时点杀伤力评分<\/h1>\n    <div class=\"sub\">以「对美科技股市场的杀伤力」为标尺，把 7 个未定价风险时点拆成 5 个可打分的轴，加权成 0–100 杀伤指数。拖动左侧权重，右侧排序与象限图实时重算。<\/div>\n    <div class=\"caveat\">主观校准估计，非测量值 · 价值在相对排序与打分逻辑透明度 · 基准日 2026-07-27（NVIDIA 循环融资定价日）<\/div>\n    <div class=\"pin\">📌 <b>常驻注意事项 · 台积电 Capex 指引<\/b>——上游先行信号，早于 Mag7 财报发布。上修＝下游 AI capex 加码坐实；下修/不及预期＝需求见顶预警。用作 6 时点「未定价度」的交叉验证锚，不单独计分。<\/div>\n    <div class=\"pin\">📌 <b>可证伪路标 · NVIDIA FY2027 Q2 10-Q（约 2026-08 下旬）<\/b>——盯两处：① 风险因素里 “We have not entered into any financing arrangements” 是否被改写；② Guarantees 附注的最大敞口是否离开 35 亿量级。<b>这是全表最干净的一条路标<\/b>：有日期、可机器查、不依赖任何解读。在 8-K 出现之前，2500 亿仍属媒体引述知情人士、非既成事实（本案前科：OpenAI 1000 亿 LOI 最终落地 300 亿股权）。<\/div>\n  <\/header>\n\n  <div class=\"grid\">\n    <!-- weights -->\n    <div class=\"panel\">\n      <h2>权重<button class=\"reset\" id=\"reset\">恢复默认<\/button><\/h2>\n      <div id=\"sliders\"><\/div>\n      <div class=\"legend\">\n        权重自动归一化（各轴占比随拖动实时换算）。<br>\n        杀伤指数 = Σ(轴分 × 权重) ÷ Σ权重 × 10\n      <\/div>\n    <\/div>\n\n    <div class=\"rightcol\">\n      <!-- table -->\n      <div class=\"panel\">\n        <h2>评分表 · 按杀伤指数降序<\/h2>\n        <table class=\"tbl\">\n          <thead><tr>\n            <th>#<\/th><th class=\"l\">时点 · 雷<\/th>\n            <th>S<\/th><th>C<\/th><th>U<\/th><th>P<\/th><th>V<\/th>\n            <th class=\"l\" style=\"padding-left:12px\">杀伤指数<\/th>\n          <\/tr><\/thead>\n          <tbody id=\"tbody\"><\/tbody>\n        <\/table>\n        <div class=\"legend\">\n          <b>S<\/b> 冲击烈度 · <b>C<\/b> 传染性 · <b>U<\/b> 未定价度 · <b>P<\/b> 触发概率 · <b>V<\/b> 速度（每轴 1–10）\n        <\/div>\n      <\/div>\n\n      <!-- scatter -->\n      <div class=\"panel scatter-wrap\">\n        <h2>象限图 · 杀伤指数 × 时间临近度<\/h2>\n        <svg id=\"scatter\" viewBox=\"0 0 640 400\" aria-label=\"quadrant chart\"><\/svg>\n        <div class=\"legend\">\n          气泡大小 = 未定价度（越大越没被市场算进去）· 纵轴随权重上下浮动，横轴（临近度）固定。<br>\n          <b>右上＝近且狠（优先盯）<\/b> · <b>左上＝远但狠（深水炸弹）<\/b> · 下半区＝慢变量，难成单点崩盘。\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"foot\">\n    数据为高时效判断，不入知识图谱（渊图铁律）。每个时点均附可观测验证信号，雷未响之前只是概率——本表用作监控清单，非结论。\n  <\/div>\n<\/div>\n\n<script>\nconst AXES=[\n  {k:\"S\",name:\"冲击烈度\",desc:\"若发生，对 Mag7 / 纳指的直接回撤深度\"},\n  {k:\"C\",name:\"传染性\",desc:\"单点 vs 全链条连锁、是否外溢到信用市场\"},\n  {k:\"U\",name:\"未定价度\",desc:\"当前价格里没算进去的比例（您指定的核心）\"},\n  {k:\"P\",name:\"触发概率\",desc:\"在其时间窗内真的点燃的可能\"},\n  {k:\"V\",name:\"速度\",desc:\"越突然分越高，越来不及避险\"},\n];\nconst DEFAULT_W={S:25,C:25,U:20,P:20,V:10};\nlet W={...DEFAULT_W};\n\nconst RISKS=[\n  {id:\"r4\",name:\"2027 收敛\",window:\"2027\",prox:5,\n   note:\"Oracle 再融资 + CoreWeave 违约 + OpenAI 现金耗尽——三根引信收敛到同一年，循环融资链一环断则全链连锁。2026-07-27 起该链条<b>首次被市场定价<\/b>：NVDA 5Y CDS 42→82bp（单日 +14bp，创该合约纪录），股价 −5%，而被担保方 CRWV +3% / NBIS +5%——市场读作风险转移、非需求造假。U 因此自 8 下调至 7（风险未变小，但「未被定价」这一属性变弱）\",\n   S:9,C:9,U:7,P:5,V:8},\n  {id:\"r6\",name:\"卖铲人被卷入信用链\",window:\"2026 H2 起\",prox:9,\n   note:\"NVIDIA 从卖铲人变担保人：已披露租赁担保簿 8.6 亿 → 35 亿（FY2027 Q1 10-Q），传闻中为 OpenAI 俄亥俄园区担保至多 <b>2500 亿<\/b>（<b>71 倍<\/b>量级跳变，未签署、双方未置评）。10-K 原文至今仍写 “We have not entered into any financing arrangements” —— <b>改写之日即坐实之时<\/b>。传导路径与其余五条相反：不是下游出事拖累上游，是上游自己进了信用链\",\n   S:7,C:8,U:6,P:6,V:7},\n  {id:\"r1\",name:\"折旧年限多米诺\",window:\"就这几天起\",prox:10,\n   note:\"一家跟随 Amazon 缩短 AI 芯片使用年限 → 机械式瞬间下修 Mag7 报告 EPS\",\n   S:6,C:8,U:5,P:6,V:7},\n  {id:\"r2\",name:\"集体 FCF 转负「提前」\",window:\"2026 H2\",prox:9,\n   note:\"MSFT/Meta/Amazon 若同季 FCF 转负，比花旗共识（2027–28）早一年坐实。窗口已进入：Epoch AI 测算该组合计 FCF 约 2026 Q3 转负（capex 年增 ~70% vs 经营现金流 ~23%）；Alphabet 已上调 capex 指引，其余三家本季财报即判定点 —— prox 自 8 上调至 9\",\n   S:5,C:7,U:5,P:5,V:6},\n  {id:\"r3\",name:\"Rubin ＝折旧雷加速器\",window:\"2026末–2027\",prox:6,\n   note:\"每代性价比 +40–50% 证伪「6 年年限」，上一代残值被重估\",\n   S:5,C:7,U:5,P:5,V:3},\n  {id:\"r5\",name:\"电网悬崖\",window:\"2027–2028\",prox:3,\n   note:\"并网 4–8 年 vs 部署 12–24 月，建好没电通 → 已投 capex 变搁浅资产\",\n   S:5,C:5,U:6,P:4,V:2},\n  {id:\"r7\",name:\"日元 carry 平仓螺旋\",window:\"2026 H2（高危窗 9/15-18 · 10/29-30）\",prox:8,\n   note:\"利差急收（日银超预期鹰 / Fed 转鸽 / 日债危机）触发快 unwind——强平首选流动性最好、浮盈最厚的 AI/半导体持仓（2024-08 模板：纳指 −3.4%、VIX 65.7、3–4 周收复），纳指级 −10~−20% drawdown。2026 新形态：美日联手干预 + FIMA 把「抛美债救日元」换成「抵押+共管」，平仓可控性系于两国财政部协调。投机净空（CFTC 非商业口径）08-04 单周由 07-28 的 −163,412 大幅释至 −45,473 张（多 147,228 / 空 192,701，单周净转向 +117,939），判燃料有序释放、非失序螺旋，维持 warming（此前 −102k 系杠杆基金口径·2026-08-03 勘误）；VIX 18.7 说明股市几乎没为此付保费（汇率期权市场付了）。<b>外生火柴 vs 内生燃料<\/b>：r1–r6 是燃料，本条是火柴\",\n   S:7,C:7,U:6,P:6,V:8},\n];\n\nfunction score(d){\n  const sum=W.S+W.C+W.U+W.P+W.V || 1;\n  const v=(d.S*W.S+d.C*W.C+d.U*W.U+d.P*W.P+d.V*W.V)/sum;\n  return v*10;\n}\n// score 40..85 -> hue 140(green)..6(red)\nfunction color(s){\n  const t=Math.max(0,Math.min(1,(s-40)/45));\n  const hue=140-(140-6)*t;\n  return `hsl(${hue},62%,52%)`;\n}\n\n/* ---- sliders ---- */\nconst slidersEl=document.getElementById(\"sliders\");\nAXES.forEach(a=>{\n  const row=document.createElement(\"div\");row.className=\"slider-row\";\n  row.innerHTML=`\n    <div class=\"slider-top\">\n      <div class=\"slider-name\"><b>${a.k}<\/b> ${a.name}<div class=\"slider-desc\">${a.desc}<\/div><\/div>\n      <div class=\"slider-val\" id=\"v_${a.k}\"><\/div>\n    <\/div>\n    <input type=\"range\" min=\"0\" max=\"40\" step=\"1\" value=\"${W[a.k]}\" id=\"s_${a.k}\">`;\n  slidersEl.appendChild(row);\n  row.querySelector(\"input\").addEventListener(\"input\",e=>{\n    W[a.k]=+e.target.value; render();\n  });\n});\ndocument.getElementById(\"reset\").addEventListener(\"click\",()=>{\n  W={...DEFAULT_W};\n  AXES.forEach(a=>document.getElementById(\"s_\"+a.k).value=W[a.k]);\n  render();\n});\n\n/* ---- render table ---- */\nconst tbody=document.getElementById(\"tbody\");\nfunction renderTable(sorted){\n  tbody.innerHTML=\"\";\n  sorted.forEach((d,i)=>{\n    const s=score(d), c=color(s);\n    const tr=document.createElement(\"tr\");tr.className=\"row\";\n    tr.innerHTML=`\n      <td class=\"cell rank ${i===0?'top':''}\">${i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1}<\/td>\n      <td class=\"cell\">\n        <div class=\"rname\">${d.name}<\/div>\n        <div class=\"rwindow\">⏱ ${d.window}<\/div>\n        <div class=\"rnote\">${d.note}<\/div>\n      <\/td>\n      <td class=\"cell axis\">${d.S}<\/td><td class=\"cell axis\">${d.C}<\/td>\n      <td class=\"cell axis\">${d.U}<\/td><td class=\"cell axis\">${d.P}<\/td>\n      <td class=\"cell axis\">${d.V}<\/td>\n      <td class=\"cell score-cell\">\n        <div class=\"score-num\" style=\"color:${c}\">${s.toFixed(0)}<\/div>\n        <div class=\"bar\"><i style=\"width:${s}%;background:${c}\"><\/i><\/div>\n      <\/td>`;\n    tbody.appendChild(tr);\n  });\n}\n\n/* ---- render scatter ---- */\nconst SVG=document.getElementById(\"scatter\");\nconst M={l:52,r:120,t:24,b:44}, W0=640,H0=400;\nconst PW=W0-M.l-M.r, PH=H0-M.t-M.b;\nconst X0=1,X1=10.5, Y0=40,Y1=85;      // domains\nconst XD=6.5, YD=60;                    // quadrant dividers\nconst sx=x=>M.l+(x-X0)/(X1-X0)*PW;\nconst sy=y=>M.t+(1-(y-Y0)/(Y1-Y0))*PH;\n// label offsets per point (dx,dy) to reduce overlap\nconst OFF={r4:[0,-20],r1:[0,-22],r2:[0,20],r3:[0,-20],r5:[0,20],r6:[0,22],r7:[0,-22]};\n\nfunction renderScatter(sorted){\n  const rankOf={}; sorted.forEach((d,i)=>rankOf[d.id]=i);\n  let g=\"\";\n  // grid\n  for(let y=40;y<=85;y+=15){g+=`<line class=\"grid-line\" x1=\"${M.l}\" y1=\"${sy(y)}\" x2=\"${M.l+PW}\" y2=\"${sy(y)}\"/>\n    <text class=\"q-label\" x=\"${M.l-10}\" y=\"${sy(y)+3}\" text-anchor=\"end\">${y}<\/text>`;}\n  // quadrant dividers\n  g+=`<line class=\"div-line\" x1=\"${sx(XD)}\" y1=\"${M.t}\" x2=\"${sx(XD)}\" y2=\"${M.t+PH}\"/>`;\n  g+=`<line class=\"div-line\" x1=\"${M.l}\" y1=\"${sy(YD)}\" x2=\"${M.l+PW}\" y2=\"${sy(YD)}\"/>`;\n  // quadrant captions\n  g+=`<text class=\"q-label\" x=\"${sx(XD)+8}\" y=\"${M.t+14}\">近且狠 · 优先盯<\/text>`;\n  g+=`<text class=\"q-label\" x=\"${M.l+6}\" y=\"${M.t+14}\">远但狠 · 深水炸弹<\/text>`;\n  g+=`<text class=\"q-label\" x=\"${sx(XD)+8}\" y=\"${M.t+PH-8}\">近但轻<\/text>`;\n  g+=`<text class=\"q-label\" x=\"${M.l+6}\" y=\"${M.t+PH-8}\">远且轻 · 慢变量<\/text>`;\n  // axis titles\n  g+=`<text class=\"ax-label\" x=\"${M.l+PW/2}\" y=\"${H0-8}\" text-anchor=\"middle\">时间临近度  远 → 近<\/text>`;\n  g+=`<text class=\"ax-label\" transform=\"translate(14,${M.t+PH/2}) rotate(-90)\" text-anchor=\"middle\">杀伤指数<\/text>`;\n  // x ticks\n  g+=`<text class=\"q-label\" x=\"${sx(3)}\" y=\"${M.t+PH+16}\" text-anchor=\"middle\">2027–28<\/text>`;\n  g+=`<text class=\"q-label\" x=\"${sx(6.5)}\" y=\"${M.t+PH+16}\" text-anchor=\"middle\">2027<\/text>`;\n  g+=`<text class=\"q-label\" x=\"${sx(10)}\" y=\"${M.t+PH+16}\" text-anchor=\"middle\">数日内<\/text>`;\n  // points\n  RISKS.forEach(d=>{\n    const s=score(d), c=color(s), cx=sx(d.prox), cy=sy(Math.max(Y0,Math.min(Y1,s)));\n    const r=6+d.U*1.15;\n    const[ox,oy]=OFF[d.id];\n    g+=`<circle class=\"pt\" cx=\"${cx}\" cy=\"${cy}\" r=\"${r}\" fill=\"${c}\" fill-opacity=\"0.28\" stroke=\"${c}\" stroke-width=\"1.6\"/>`;\n    g+=`<circle cx=\"${cx}\" cy=\"${cy}\" r=\"2.4\" fill=\"${c}\"/>`;\n    const anchor = ox<0?\"end\":(ox>0?\"start\":\"middle\");\n    g+=`<text class=\"pt-label\" x=\"${cx+ox}\" y=\"${cy+oy}\" text-anchor=\"${anchor}\">${d.name}<\/text>`;\n    g+=`<text class=\"pt-score\" x=\"${cx+ox}\" y=\"${cy+oy+13}\" text-anchor=\"${anchor}\" fill=\"${c}\">${s.toFixed(0)}<\/text>`;\n  });\n  SVG.innerHTML=g;\n}\n\nfunction render(){\n  AXES.forEach(a=>document.getElementById(\"v_\"+a.k).textContent=W[a.k]+\"%\");\n  const sorted=[...RISKS].sort((a,b)=>score(b)-score(a));\n  renderTable(sorted);\n  renderScatter(sorted);\n}\nrender();\n<\/script>\n<\/body>\n<\/html>\n";

  h+=`<div class="dhead"><div class="dt-type">Risk Compound · 组合回测</div><h3>${x.name}</h3></div>`;
  h+=`<div class="dtemp"><span class="dband" style="color:var(--amber);font-size:15px">${x.status}</span></div>`;
  h+=`<div class="dsec"><div class="dh">成分 · 分子</div><div class="dchips">${ms.map(m=>chip(m.name)).join('')}</div></div>`;
  h+=`<div class="dsec"><div class="dh">溯源 · 原子</div><div class="dchips">${as.map(a=>chip(a.name)).join('')}</div></div>`;
  h+=`<div class="dsec"><div class="dh">说明</div><div class="db">P1 占位·未回测。将回测「${x.name}」这一分子组合对市场的差异影响（复用剑酒青丘《回测设计七问》；确证按量分档 ≥20 确证 / 10–19 暂定 / <10 方向真）。</div></div>`;
 }
 document.getElementById('dpanel').innerHTML=h;document.getElementById('detail-overlay').hidden=false;}
