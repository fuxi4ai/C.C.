.board{position:relative;margin-top:6px}

 box-shadow:var(--whisper),inset 0 0 0 1px rgba(255,255,255,.42);
 transition:transform .16s,box-shadow .16s,border-color .16s,opacity .16s}
.scard::after{content:"";position:absolute;left:0;right:0;top:0;height:32%;border-radius:14px 14px 0 0;background:linear-gradient(180deg,rgba(255,255,255,.44),transparent 90%);pointer-events:none;z-index:2}
.scard:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--sc,#888) 45%,var(--line));box-shadow:var(--whisper),0 7px 22px rgba(20,20,19,.10),inset 0 0 0 1px rgba(255,255,255,.55),0 0 16px -3px color-mix(in srgb,var(--glow,var(--sc,#888)) 90%,transparent)}

.scard[data-trig="fired"]{animation:scardGlow 2.2s ease-in-out infinite}
@keyframes scardGlow{0%,100%{box-shadow:var(--whisper),inset 0 0 0 1px rgba(255,255,255,.42),0 0 7px -2px rgba(192,57,43,.5)}

@media (prefers-reduced-motion:reduce){.scard[data-trig="fired"]{animation:none}}

.scard{padding-bottom:42px}  /* 给底部绝对定位的 srow 留位（2026-07-27 起化合物卡也有剂量灯行；2026-07-28 38→42px 容 strig 两行）*/

.scard .sbd{font-size:11px;font-weight:700}

   右下角硬上限 ~97px（11px 中文约 8 字）。超出者折两行、右对齐、与杀伤灯底部对齐（srow align-items:flex-end）。 */
.scard .p1{font-size:10px;color:var(--amber);margin-top:3px}

.dz-badge.warn{color:#e0791e;animation-name:dzBreathOrange}  /* 兆=传导预警·橘 */
@keyframes dzBreathOrange{0%,100%{opacity:.74;transform:scale(1);text-shadow:0 0 4px rgba(224,121,30,.55),0 0 8px rgba(224,121,30,.35),1px 1px 2px rgba(0,0,0,.3)}50%{opacity:1;transform:scale(1.12);text-shadow:0 0 7px rgba(224,121,30,1),0 0 15px rgba(224,121,30,.72),0 0 26px rgba(224,121,30,.45),1px 1px 2px rgba(0,0,0,.3)}}
@media (prefers-reduced-motion:reduce){.dz-badge.warn{animation:none;text-shadow:0 0 8px rgba(224,121,30,.85),1px 1px 2px rgba(0,0,0,.3)}}

.dz-badge.warn.still{text-shadow:0 0 5px rgba(224,121,30,.9),0 0 11px rgba(224,121,30,.5),1px 1px 2px rgba(0,0,0,.3)}  /* 兆:静态橘发光·无呼吸 */

facts\":\"2月整体CPI季调环比0.3%、同比2.4%；核心环比0.2%、同比2.5%。住房环比0.2%，能源0.6%。\",\"limits\":\"未做盘中因果识别，未穷尽同期公司与地缘信息；方向属于 VV 事后研究，非市场共识或归因份额。机构文字冲突单列，首发数字以 BLS 为准。\",\"market_evidence\":[],\"rationale\":\"住房与核心价格温和，可缓和基础通胀担忧；但这份数据描述2月价格，不能覆盖发布时已经出现的能源及供应风险。因此对SOX不赋单边方向。\",\"reference_period\":\"2026-02\",\"release_date\":\"2026-03-11\",\"released_at_utc\":\"2026-03-11T12:30:00+00:00\",\"review_event_sha256\":\"aec7d5a529547a1267dafe08a57a84d356afbf7ee866b7cf285b1d19044db9c4\",\"reviewed_at_utc\":\"2026-09-08T12:07:14.977537+00:00\",\"scope\":\"事后复盘该次发布对 SOX 的传导判断；不是当时已知预测、净价格因果确证或现行交易建议。\",\"source_quality_notes\":\"ING当时称核心温和、但伊朗行动及能源成本将改变后续通胀背景。其正文headline/core同比数字与BLS存在对调冲突，本判断的全部CPI数字只采用BLS。\",\"sources\":[{\"role\":\"BLS original release; read this session\",\"title\":\"BLS 原始发布 · 2026-03-11\",\"url\":\"https://www.bls.gov/news.release/archives/cpi_03112026.htm\"},{\"role\":\"contemporaneous named institutional interpretation; read/search-retrieved this session\",\"title\":\"ING · 当时的传导解读\",\"url\":\"https://think.ing.com/snaps/benign-us-inflation-backdrop-ahead-of-iran-action/\"}],\"status\":\"missing_evidence\",\"target\":\"^SOX\"},\"id\":\"macro:CPI_US:2026-02\",\"observation\":\"历史发布记录；当前研究快照不代表事件当时可得信息。\",\"original_date\":\"2026-03-11\",\"research_url\":null,\"sources\":[{\"title\":\"U.S. Bureau of Labor Statistics\",\"url\":\"https://www.bls.gov/cpi/\"}],\"stage\":\"已公布\",\"summary\":\"U.S. Bureau of Labor Statistics · 参考期 2026-02\",\"title\":\"CPI · 2026-02\"},{\"category\":\"policy\",\"date\":\"2026-03-18\",\"details\":{\"data_quality\":\"verified_actual_consensus_if_available\",\"fetched_at_utc\":\"2026-09-05T13:33:25+00:00\",\"reference_period\":\"2026-03-18\",\"release_timezone\":\"America/New_York\",\"released_at_utc\":\"2026-03-18T18:00:00+00:00\",\"source_kind\":\"official_or_official_via_FRED\"},\"direction\":\"unknown\",\"direction_basis\":\"已公布事实不自动构成 SOX 利好或利空；尚无通过身份、证据和时点核验的事后研究判断。\",\"direction_kind\":\"unknown\",\"expectations\":[],\"history_assessment\":{\"attribution\":\"VV 事后研究判断；非事件当时预测，非 SOX 净价格因果确证。\",\"channel\":\"通胀约束、保留宽松路径与增长渠道相抵\",\"confidence\":\"medium_low\",\"counterevidence\":\"年末政策中值未上移，且相对期权零降息众数可能偏温和。；增长预测上修可能支持半导体需求；中东油价和其他行业新闻也影响全日市场。；SOX次日+0.8745%，第五交易日累计+2.2145%（从公告日收盘起），不支持持续净负面因果确证。\",\"direction\":\"unknown\",\"event_id\":\"macro:FOMC_RATE_DECISION:2026-03-18\",\"expectation_qualification\":\"minutes事后记述：会前期货直到12月才完全计入一次降息，期权众数已是不变；较早Desk调查仍两次降息，但部分受访者随后减少预期。预期口径分歧，不能把点阵的一次降息称作统一市场的鹰派意外。\",\"facts\":\"维持3.50%–3.75%，11票赞成、Miran主张降息25bp。2026年末利率中值仍3.4%；PCE预测2.4%→2.7%、核心PCE 2.5%→2.7%，GDP 2.3%→2.4%。Powell说明部分参与者减少拟议降息次数，并把降息与通胀改善绑定。\",\"limits\":\"真实DB macro_release_values中该事件0行，不能引用本地可用共识/惊喜数值。；historical_review FOMC_MPS_RAW与FOMC_MPS_ORTH均mps_unavailable，缺30分钟公告冲击。；全日SOX/Yahoo与国债收益率/FRED含会前和其他同时信息；无净因果识别。\",\"market_evidence\":[],\"rationale\":\"通胀预测上修、降息更依赖通胀改善，对估值支持不利；但年末利率中值未变、GDP上修，而且会前期权众数已为零降息。公开证据不足以对相抵渠道排序，复盘保留分歧。\",\"reference_period\":\"2026-03-18\",\"release_date\":\"2026-03-18\",\"released_at_utc\":\"2026-03-18T18:00:00+00:00\",\"review_event_sha256\":\"89cf71304dade77ea3be2ccc7dda7807a07267914e2414635389c0558bf34c56\",\"reviewed_at_utc\":\"2026-09-08T12:08:13.811473+00:00\",\"scope\":\"事后复盘该次发布对 SOX 的传导判断；不是当时已知预测、净价格因果确证或现行交易建议。\",\"source_quality_notes\":\"\",\"sources\":[{\"public_timing\":\"meeting_day_communication\",\"supports\":\"利率决定、投票\",\"title\":\"statement 2026-03-18\",\"url\":\"https://www.federalreserve.gov/newsevents/pressreleases/monetary20260318a.htm\"},{\"public_timing\":\"meeting_day_communication\",\"supports\":\"2026通胀/GDP与年末政策中值前后对照\",\"title\":\"sep 2026-03-18\",\"url\":\"https://www.federalreserve.gov/monetarypolicy/fomcprojtabl20260318.htm\"},{\"public_timing\":\"meeting_day_communication\",\"supports\":\"发布会第4–5页：更少降息、通胀改善条件\",\"title\":\"press 2026-03-18\",\"url\":\"https://www.federalreserve.gov/mediacenter/files/FOMCpresconf20260318.pdf\"},{\"public_timing\":\"post_meeting_minutes\",\"supports\":\"会前期货/期权与Desk调查不同；会后公开的历史重构\",\"title\":\"minutes 2026- \"event_id\":\"macro:CPI_US:2026-03\",\"expectation_qualification\":\"整体CPI基准来自旧registry，声称有公布前时间戳，但未独立重新冻结；核心基准为事后历史日历，无精确known_at。可描述当时所报预测差，不能冒充严格可检验事前惊喜。\",\"facts\":\"3月整体CPI季调环比0.9%、同比3.3%；核心环比0.2%、同比2.6%。能源环比10.9%，汽油21.2%，汽油贡献接近整体月增幅四分之三。\",\"limits\":\"未做盘中因果识别，未穷尽同期公司与地缘信息；方向属于 VV 事后研究，非市场共识或归因份额。机构文字冲突单列，首发数字以 BLS 为准。\",\"market_evidence\":[],\"rationale\":\"核心仍为0.2%且大部分总体上行集中能源，减轻广泛基础通胀迅速扩散的担忧；能源大涨同时侵蚀居民实际购买力、增加企业成本和后续通胀风险。利率与现金流渠道相抵，判断分歧，温和核心一侧偏利好。\",\"reference_period\":\"2026-03\",\"release_date\":\"2026-04-10\",\"released_at_utc\":\"2026-04-10T12:30:00+00:00\",\"review_event_sha256\":\"3f2600a7b2d65c2d0a96c8f43526ccf9c5ae7f9f02c7b10121ea997f4eb2fd24\",\"reviewed_at_utc\":\"2026-09-08T12:07:14.977537+00:00\",\"scope\":\"事后复盘该次发布对 SOX 的传导判断；不是当时已知预测、净价格因果确证或现行交易建议。\",\"source_quality_notes\":\"本轮未取得合格同日一手机构完整解读；方向基于BLS分项结构的VV研究判断，不把历史共识差直接作利好。\",\"sources\":[{\"role\":\"BLS original release; read this session\",\"title\":\"BLS 原始发布 · 2026-04-10\",\"url\":\"https://www.bls.gov/news.release/archives/cpi_04102026.htm\"}],\"status\":\"missing_evidence\",\"target\":\"^SOX\"},\"id\":\"macro:CPI_US:2026-03\",\"observation\":\"历史发布记录；当前研究快照不代表事件当时可得信息。\",\"original_date\":\"2026-04-10\",\"research_url\":null,\"sources\":[{\"title\":\"U.S. Bureau of Labor Statistics\",\"url\":\"https://www.bls.gov/cpi/\"}],\"stage\":\"已公布\",\"summary\":\"U.S. Bureau of Labor Statistics · 参考期 2026-03\",\"title\":\"CPI · 2026-03\"},{\"category\":\"policy\",\"date\":\"2026-04-29\",\"details\":{\"data_quality\":\"verified_actual_consensus_if_available\",\"fetched_at_utc\":\"2026-09-05T13:33:25+00:00\",\"reference_period\":\"2026-04-29\",\"release_timezone\":\"America/New_York\",\"released_at_utc\":\"2026-04-29T18:00:00+00:00\",\"source_kind\":\"official_or_official_via_FRED\"},\"direction\":\"unknown\",\"direction_basis\":\"已公布事实不自动构成 SOX 利好或利空；尚无通过身份、证据和时点核验的事后研究判断。\",\"direction_kind\":\"unknown\",\"expectations\":[],\"history_assessment\":{\"attribution\":\"VV 事后研究判断；非事件当时预测，非 SOX 净价格因果确证。\",\"channel\":\"未来宽松路径弱化与估值风险；与强盈利/行业需求渠道竞争。\",\"confidence\":\"medium\",\"counterevidence\":\"多数仍保留宽松措辞，未实际收紧；既有市场已减少降息预期。；SOX全日+2.3488%而2年收益率+8bp；行业盈利或需求足以抵消折现压力，不能声称FOMC净压低SOX。；第五交易日窗口与ADP重叠，长窗口不能孤立归因。\",\"direction\":\"bearish\",\"event_id\":\"macro:FOMC_RATE_DECISION:2026-04-29\",\"expectation_qualification\":\"minutes事后记述：会前市场大体预计当年利率少变，期权计入约30%的2027Q1前加息概率；Desk调查仍预计未来一年两次降息但时间延后。因此定性鹰派沟通成立，公告意外强度未量化。\",\"facts\":\"维持3.50%–3.75%。Miran支持降息25bp；Hammack、Kashkari、Logan支持维持却反对声明中的宽松偏向。Powell在发布会称委员会中枢正趋于中性，保留旧措辞不代表仍有强烈降息承诺。\",\"limits\":\"真实DB macro_release_values中该事件0行，不能引用本地可用共识/惊喜数值。；historical_review FOMC_MPS_RAW与FOMC_MPS_ORTH均mps_unavailable，缺30分钟公告冲击。；全日SOX/Yahoo与国债收益率/FRED含会前和其他同时信息；无净因果识别。\",\"market_evidence\":[],\"rationale\":\"VV把此次新增的宽松立场削弱评为SOX估值渠道偏利空：更少政策宽松支持、利率路径不确定性提高。不是因SOX当日上涨而判利好，也不是把三名异议误称为当次加息票。\",\"reference_period\":\"2026-04-29\",\"release_date\":\"2026-04-29\",\"released_at_utc\":\"2026-04-29T18:00:00+00:00\",\"review_event_sha256\":\"df3272bd390c39f257103a05c584a208c1b472ab02605af16ec500845eb3b040\",\"reviewed_at_utc\":\"2026-09-08T12:08:13.811473+00:00\",\"scope\":\"事后复盘该次发布对 SOX 的传导判断；不是当时已知预测、净价格因果确证或现行交易建议。\",\"source_quality_notes\":\"\",\"sources\":[{\"public_timing\":\"meeting_day_communication\",\"supports\":\"四名异议须区分一名降息和三名反对宽松措辞\",\"title\":\"statement 2026-04-29\",\"url\":\"https://www.federalreserve.gov/newsevents/pressreleases/monetary20260429a.htm\"},{\"public_timing\":\"meeting_day_communication\",\"supports\":\"发布会第24页：中枢趋向中性\",\"title\":\"press 2026-04-29\",\"url\":\"https://www.federalreserve.gov/mediacenter/files/FOMCpresconf20260429.pdf\"},{\"public_timing\":\"post_meeting_minutes\",\"supports\":\"会前市场与调查预期、当时盈利与风险情绪；会后公开\",\"title\":\"minutes 2026-04-29\",\"url\":\"https://www.federalreserve.gov/monetarypolicy/fomcminutes20260429.htm\"}],\"status\":\"missing_evidence\",\"target\":\"^SOX\"},\"id\":\"macro:FOMC_RATE_DECISION:2026-04-29\",\"observation\":\"历史发布记录；当前研究快照不代表事件当时可得信息。\",\"original_date\":\"2026-04 司与地缘信息；方向属于 VV 事后研究，非市场共识或归因份额。机构文字冲突单列，首发数字以 BLS 为准。\",\"market_evidence\":[],\"rationale\":\"价格压力从能源延伸到核心和住房，增加高利率维持或再收紧风险；居民实际购买力受损及企业投入成本上升形成第二条压力。对远期现金流权重较高的半导体估值，研究判断偏利空。\",\"reference_period\":\"2026-04\",\"release_date\":\"2026-05-12\",\"released_at_utc\":\"2026-05-12T12:30:00+00:00\",\"review_event_sha256\":\"0ed31bfd41aa92148dde09a3ed837d3d0656c5479e2eb2690a8295e6c7c13142\",\"reviewed_at_utc\":\"2026-09-08T12:07:14.977537+00:00\",\"scope\":\"事后复盘该次发布对 SOX 的传导判断；不是当时已知预测、净价格因果确证或现行交易建议。\",\"source_quality_notes\":\"KPMG 5/12讨论核心粘性、实际购买力和政策收紧风险；只借其机制解读，官方分项数字全部来自BLS。\",\"sources\":[{\"role\":\"BLS original release; read this session\",\"title\":\"BLS 原始发布 · 2026-05-12\",\"url\":\"https://www.bls.gov/news.release/archives/cpi_05122026.htm\"},{\"role\":\"contemporaneous named institutional interpretation; read/search-retrieved this session\",\"title\":\"KPMG · 经济解读\",\"url\":\"https://kpmg.com/us/en/articles/2026/april-2026-cpi.html\"},{\"role\":\"contemporaneous named institutional interpretation; read/search-retrieved this session\",\"title\":\"Insight Investment · 通胀解读\",\"url\":\"https://www.insightinvestment.com/united-states/perspectives/instant-insights-more-energy-for-inflation/\"}],\"status\":\"missing_evidence\",\"target\":\"^SOX\"},\"id\":\"macro:CPI_US:2026-04\",\"observation\":\"历史发布记录；当前研究快照不代表事件当时可得信息。\",\"original_date\":\"2026-05-12\",\"research_url\":null,\"sources\":[{\"title\":\"U.S. Bureau of Labor Statistics\",\"url\":\"https://www.bls.gov/cpi/\"}],\"stage\":\"已公布\",\"summary\":\"U.S. Bureau of Labor Statistics · 参考期 2026-04\",\"title\":\"CPI · 2026-04\"},{\"category\":\"macro\",\"date\":\"2026-06-05\",\"details\":{\"data_quality\":\"verified_actual_consensus_if_available\",\"fetched_at_utc\":\"2026-09-05T13:33:25+00:00\",\"reference_period\":\"2026-05\",\"release_timezone\":\"America/New_York\",\"released_at_utc\":\"2026-06-05T12:30:00+00:00\",\"source_kind\":\"official_or_official_via_FRED\"},\"direction\":\"unknown\",\"direction_basis\":\"已公布事实不自动构成 SOX 利好或利空；尚无通过身份、证据和时点核验的事后研究判断。\",\"direction_kind\":\"unknown\",\"expectations\":[],\"history_assessment\":{\"attribution\":\"VV 事后研究判断；非事件当时预测，非 SOX 净价格因果确证。\",\"channel\":\"折现率/政策重新计价\",\"confidence\":\"medium\",\"counterevidence\":\"工资同比3.4%且就业并非全面过热；First Trust认为加息不明智且不太可能。SOX五日内大幅回补跌幅，因此不能把首日跌幅全归因NFP；公司/仓位冲击未完整排除。\",\"direction\":\"bearish\",\"event_id\":\"macro:NONFARM_PAYROLLS_US:2026-05\",\"expectation_qualification\":\"本地历史登记共识，仅为背景；未独立重建公告前调查原始版本，不宣称严格事前冻结或机构共识。9月4日缺精确known_at，尤其不能作合格前瞻surprise。\",\"facts\":\"5月非农首发+17.2万人；失业率4.3%；时薪环比+0.3%、同比+3.4%；前两月合计上修9.3万人。就业增加集中于休闲酒店、地方政府与医疗。\",\"institution_interpretation\":\"First Trust 6月8日回顾报告称强就业后期货转而计价年内25bp加息，团队自身反对并认为加息不太可能。该材料在事件后三天，不能作为事前预期。\",\"limits\":\"BLS原发布本轮在线回读；就业方向为研究推断，BLS不提供SOX方向。；本地SOX/FRED端点已本轮逐一回读并重算；未从外部重新获取行情。；单日/五日数据不能排除公司、地缘、能源和仓位消息；未估计因果份额。；7次判断均为事后研究，无法代替当时的预测记录或OOS验证。\",\"market_evidence\":[],\"rationale\":\"VV事后研究判断：偏利空SOX的短期估值端。就业强度与大额上修减弱近期政策宽松理由，并提高更紧政策的风险；对长久期现金流的折现压力是本次优先解释，增长改善为相反渠道。\",\"reference_period\":\"2026-05\",\"release_date\":\"2026-06-05\",\"released_at_utc\":\"2026-06-05T12:30:00+00:00\",\"review_event_sha256\":\"0db85be0c20716d6169ee2f646026632ac5b98cbabc64a405325cffe0b722b39\",\"reviewed_at_utc\":\"2026-09-08T12:08:28.001146+00:00\",\"scope\":\"事后复盘该次发布对 SOX 的传导判断；不是当时已知预测、净价格因果确证或现行交易建议。\",\"source_quality_notes\":\"\",\"sources\":[{\"kind\":\"primary_release\",\"published_at\":\"2026-06-05T12:30:00+00:00\",\"title\":\"BLS 原始发布 · 2026-06-05\",\"url\":\"https://www.bls.gov/news.release/archives/empsit_06052026.htm\",\"verified_at_utc\":\"2026-09-08T12:08:28.001146+00:00\"},{\"kind\":\"named_institution_interpretation\",\"published_at\":\"2026-06-08\",\"title\":\"First Trust 6月8日回顾报告称强就业后期货转而计价年内25bp加息，团队自身反对并认为加息不太可能。该材料在事件后三天，不能作为事前预期。\",\"url\":\"https://www.ftportfolios.com/Commentary/EconomicResearch/2026/6/8/are-rate-hikes-on-the-way\",\"verified_at_utc\":\"2026-09-08T12:08:28.001146+00:00\"}],\"status\":\"missing_evidence\",\"target\":\"^SOX\"} 价格风险；First Trust当日表列核心0.2%及实际时薪下滑。它们是当时具名解读，不是市场统一判断。\",\"sources\":[{\"role\":\"BLS original release; read this session\",\"title\":\"BLS 原始发布 · 2026-06-10\",\"url\":\"https://www.bls.gov/news.release/archives/cpi_06102026.htm\"},{\"role\":\"contemporaneous named institutional interpretation; read/search-retrieved this session\",\"title\":\"KPMG · 经济解读\",\"url\":\"https://kpmg.com/us/en/articles/2026/may-2026-cpi.html\"},{\"role\":\"contemporaneous named institutional interpretation; read/search-retrieved this session\",\"title\":\"contemporaneous named institutional interpretation; read/search-retrieved this session\",\"url\":\"https://www.ftportfolios.com/Commentary/EconomicResearch/2026/6/10/the-consumer-price-index-cpi-rose-0.5percent-in-may\"}],\"status\":\"missing_evidence\",\"target\":\"^SOX\"},\"id\":\"macro:CPI_US:2026-05\",\"observation\":\"历史发布记录；当前研究快照不代表事件当时可得信息。\",\"original_date\":\"2026-06-10\",\"research_url\":null,\"sources\":[{\"title\":\"U.S. Bureau of Labor Statistics\",\"url\":\"https://www.bls.gov/cpi/\"}],\"stage\":\"已公布\",\"summary\":\"U.S. Bureau of Labor Statistics · 参考期 2026-05\",\"title\":\"CPI · 2026-05\"},{\"category\":\"policy\",\"date\":\"2026-06-17\",\"details\":{\"data_quality\":\"verified_actual_consensus_if_available\",\"fetched_at_utc\":\"2026-09-05T13:33:25+00:00\",\"reference_period\":\"2026-06-17\",\"release_timezone\":\"America/New_York\",\"released_at_utc\":\"2026-06-17T18:00:00+00:00\",\"source_kind\":\"official_or_official_via_FRED\"},\"direction\":\"unknown\",\"direction_basis\":\"已公布事实不自动构成 SOX 利好或利空；尚无通过身份、证据和时点核验的事后研究判断。\",\"direction_kind\":\"unknown\",\"expectations\":[],\"history_assessment\":{\"attribution\":\"VV 事后研究判断；非事件当时预测，非 SOX 净价格因果确证。\",\"channel\":\"预期政策路径上移、折现约束及滞胀压力；未以名义收益率机械代替实际利率。\",\"confidence\":\"medium\",\"counterevidence\":\"撤前瞻指引也属沟通框架变化，不能单独等同紧缩。；Fed正式材料认可生产率和资本开支强；科技盈利预期支持股价。；SOX全日+1.3754%、次日+6.4162%，与同日2年收益率+15bp并存；没有纯净30分钟冲击，不能称此次会议造成SOX下跌。\",\"direction\":\"bearish\",\"event_id\":\"macro:FOMC_RATE_DECISION:2026-06-17\",\"expectation_qualification\":\"minutes事后记述：会前普遍预计6月不动，Desk调查为2027年初前不变、Q2降息；市场则计入2027年中一次加息（含期限溢价）。SEP相比3月更鹰，也比调查更早体现紧缩，但不是唯一市场共识。\",\"facts\":\"一致维持3.50%–3.75%；Warsh首场发布会撤去前瞻指引，重申价格稳定。SEP的2026/2027年末政策中值由3.4%/3.1%升至3.8%/3.6%；2026 PCE 2.7%→3.6%、核心2.7%→3.3%，GDP 2.4%→2.2%。\",\"limits\":\"真实DB macro_release_values中该事件0行，不能引用本地可用共识/惊喜数值。；historical_review FOMC_MPS_RAW与FOMC_MPS_ORTH均mps_unavailable，缺30分钟公告冲击。；全日SOX/Yahoo与国债收益率/FRED含会前和其他同时信息；无净因果识别。\",\"market_evidence\":[],\"rationale\":\"四次中政策路径向上的证据最强。VV评为SOX估值渠道偏利空：更高且更久的政策路径与较弱增长、较高通胀组合削弱估值支持。强AI投资和供应商盈利抵消真实存在，因此信心限于渠道，不宣称SOX净收益因果已确认。\",\"reference_period\":\"2026-06-17\",\"release_date\":\"2026-06-17\",\"released_at_utc\":\"2026-06-17T18:00:00+00:00\",\"review_event_sha256\":\"e3b7ed75bc8b5c47acb15fb0bd0947f3e83b372606468962e9d8c47094b56cf2\",\"reviewed_at_utc\":\"2026-09-08T12:08:13.811473+00:00\",\"scope\":\"事后复盘该次发布对 SOX 的传导判断；不是当时已知预测、净价格因果确证或现行交易建议。\",\"source_quality_notes\":\"\",\"sources\":[{\"public_timing\":\"meeting_day_communication\",\"supports\":\"维持利率、强投资与通胀表述\",\"title\":\"statement 2026-06-17\",\"url\":\"https://www.federalreserve.gov/newsevents/pressreleases/monetary20260617a.htm\"},{\"public_timing\":\"meeting_day_communication\",\"supports\":\"利率、通胀、GDP中值对照\",\"title\":\"sep 2026-06-17\",\"url\":\"https://www.federalreserve.gov/monetarypolicy/fomcprojtabl20260617.htm\"},{\"public_timing\":\"meeting_day_communication\",\"supports\":\"第2页：取消前瞻指引、主席本人未提交SEP预测\",\"title\":\"press 2026-06-17\",\"url\":\"https://www.federalreserve.gov/mediacenter/files/FOMCpresconf20260617.pdf\"},{\"public_timing\":\"post_meeting_minutes\",\"supports\":\"会前调查与市场定价、技术盈利；会后公开\",\"title\":\"minutes 2026-06-17\",\"url\":\"https://www.federalreserve.gov/monetarypolicy/fomcminutes20260617.htm\"}],\"status\":\"missing_evidence\",\"target\":\"^SOX\"},\"id\":\"macro:FOMC_RATE_DECISION:2026-06-17\",\"observation\":\"历史发布记录；当前研究快照不代表事件当时可得信息。\",\"original_date\":\"2026-06-17\",\"research_url\":null,\"sources\":[{\"title\":\"Federal Open Market Committee\",\"url\":\"https://www.federalreserve.gov/newsevents/pressreleases/monetary20260617a.htm\"}],\"stage\":\"已公布\",\"summary\":\"Federal Open Market Committee · 参考期 2026-06-17\",\"title\":\"FOMC · 2026-06-17\"},{\"category\":\"macro\",\"date\":\"2026-07-02\",\"details\":{\"data_quality\":\"verified_actual_consensus_if_available\",\"fetched_at_utc\":\"2026-09-05T13:33:25+00:00\",\"reference_period\":\"2026-06\",\"release_timezone\":\"America/New_York\",\"released_at_utc\":\"2026-07-02T12:30:00+00:00\",\"source_kind\":\"official_or_official_via_FRED\"},\"direction\":\"unknown\",\"direction_basis\":\"已公布事实不自动构成 SOX 利好或利空；尚无通过身份、证据和时点核验的事后研究判断。\",\"direction_kind\":\"unknown\",\"expectations\":[],\"history_assessment\":{\"attribution\":\"VV 事后研究判断；非事件当时预测，非 SOX 净价格因果确证。\",\"channel\":\"需求质量与政策折现渠道相抵\",\"confidence\":\"low\",\"counterevidence\":\"专业商业服务与医疗仍增员，较弱就业可缓和加息压力；当日2Y下降3bp支持反向折现渠道，10Y未跟随下降。缺少已核同期机构对SOX净影响的判断；该标签仅是VV宏观传导判断。\",\"direction\":\"unknown\",\"event_id\":\"macro:NONFARM_PAYROLLS_US:2026-06\",\"expectation_qualification\":\"本地历史登记共识，仅为背景；未独立重建公告前调查原始版本，不宣称严格事前冻结或机构共识。9月4日缺精确known_at，尤其不能作合格前瞻surprise。\",\"facts\":\"6月非农首发+5.7万人；失业率4.2%；参与率下降0.3个百分点至61.5%、就业人口比降至59.0%；时薪环比+0.3%、同比+3.5%；前两月合计下修7.4万人。\",\"institution_interpretation\":null,\"limits\":\"BLS原发布本轮在线回读；就业方向为研究推断，BLS不提供SOX方向。；本地SOX/FRED端点已本轮逐一回读并重算；未从外部重新获取行情。；单日/五日数据不能排除公司、地缘、能源和仓位消息；未估计因果份额。；7次判断均为事后研究，无法代替当时的预测记录或OOS验证。\",\"market_evidence\":[],\"rationale\":\"就业与参与率偏弱增加需求担忧，同时可能缓和加息压力。现有证据不能证明盈利渠道强于折现缓冲，也缺足够政策反应旁证；复盘保留分歧。\",\"reference_period\":\"2026-06\",\"release_date\":\"2026-07-02\",\"released_at_utc\":\"2026-07-02T12:30:00+00:00\",\"review_event_sha256\":\"382055d106faacf24fe0ee3638162d571efb4e592d828b4056aea0e8c8f7bbe0\",\"reviewed_at_utc\":\"2026-09-08T12:08:28.001146+00:00\",\"scope\":\"事后复盘该次发布对 SOX 的传导判断；不是当时已知预测、净价格因果确证或现行交易建议。\",\"source_quality_notes\":\"\",\"sources\":[{\"kind\":\"primary_release\",\"published_at\":\"2026-07-02T12:30:00+00:00\",\"title\":\"BLS 原始发布 · 2026-07-02\",\"url\":\"https://www.bls.gov/news.release/archives/empsit_07022026.htm\",\"verified_at_utc\":\"2026-09-08T12:08:28.001146+00:00\"}],\"status\":\"missing_evidence\",\"target\":\"^SOX\"},\"id\":\"macro:NONFARM_PAYROLLS_US:2026-06\",\"observation\":\"历史发布记录；当前研究快照不代表事件当时可得信息。\",\"original_date\":\"2026-07-02\",\"research_url\":null,\"sources\":[{\"title\":\"U.S. Bureau of Labor Statistics\",\"url\":\"https://fred.stlouisfed.org/series/PAYEMS\"}],\"stage\":\"已公布\",\"summary\":\"U.S. Bureau of Labor Statistics · 参考期 2026-06\",\"title\":\"NFP · 2026-06\"},{\"category\":\"macro\",\"date\":\"2026-07-14\",\"details\":{\"data_quality\":\"verified_actual_consensus_if_available\",\"fetched_at_utc\":\"2026-09-05T13:33:25+00:00\",\"reference_period\":\"2026-06\",\"release_timezone\":\"America/New_York\",\"released_at_utc\":\"2026-07-14T12:30:00+00:00\",\"source_kind\":\"official_or_official_via_FRED\"},\"direction\":\"unknown\",\"direction_basis\":\"已公布事实不自动构成 SOX 利好或利空；尚无通过身份、证据和时点核验的事后研究判断。\",\"direction_kind\":\"unknown\",\"expectations\":[],\"history_assessment\":{\"attribution\":\"VV 事后研究判断；非事件当时预测，非 SOX 净价格因果确证。\",\"channel\":\"折现为主、现金流为辅\",\"confidence\":\"medium\",\"counterevidence\":\"Insight提醒伊朗紧张可能令能源重新上涨；单月降价及保险等项目不可线性外推。SOX当日+2.54%，2Y/10Y-8/-4bp支持但不证明机制；随后3日SOX-7.80%且5日2Y回升8bp，明确反驳持续利好等于持续上涨。；同日 Warsh 国会证词也影响政策解读，ING 将其与 CPI 一并讨论，不能将全日反应独归 CPI。\",\"direction\":\"bullish\",\"event_id\":\"macro:CPI_US:2026-06\",\"expectation_qualification\":\"整体CPI基准来自旧registry，声称有公布前时间戳，但未独立重新冻结；核心基准为事后历史日历，无精确known_at。可描述当时所报预测差，不能冒充严格可检验事前惊喜。\",\"facts\":\"6月整体CPI季调环比-0.4%、同比3.5%；核心环比0.0%、同比2.6%。能源环比-5.7%，汽油-9.7%；多个核心分项降价，住房与食品仍上升。\",\"limits\":\"未做盘中因果识别，未穷尽同期公司与地缘信息；方向属于 VV 事后研究，非市场共识或归因份额。机构文字冲突单列，首发数字以 BLS 为准。\",\"market_evidence\":[],\"rationale\":\"降温不只来自能源，核心商品和服务也表现温和，缓解基础通胀及近期加息压力；能源回落同时改善居民购买力和非能源企业成本。两条主要渠道方向一致，研究判断对SOX偏利好。\",\"reference_period\":\"2026-06\",\"release_date\":\"2026-07-14\",\"released_at_utc\":\"202 AI投资盈利另有支持。\",\"confidence\":\"medium\",\"counterevidence\":\"若公告窗口期货显示未来路径显著上修且半导体超额收益下行，可支持偏利空；当前无该窗口数据。；2年收益率当天-4bp，10年+6bp，未呈单一短端鹰派冲击。；SOX次日+8.1886%、第五日累计+14.9451%；且后者与ADP重叠。不能以当天跌幅建立持续政策因果。\",\"direction\":\"unknown\",\"event_id\":\"macro:FOMC_RATE_DECISION:2026-07-29\",\"expectation_qualification\":\"minutes事后记述：会前基准为不动，但约1/3概率当次加息；9月25bp已完全计价、次年Q1末再一次。Desk调查反而当年/次年不变。此种分歧使“维持=鸽派”及“三票加息=鹰派意外”都不能无条件成立。\",\"facts\":\"9比3维持3.50%–3.75%；Hammack、Kashkari、Logan明确要求加息25bp。Warsh重申2%目标和必要时行动，同时未承诺9月动作，并认可AI资本开支强。\",\"limits\":\"真实DB macro_release_values中该事件0行，不能引用本地可用共识/惊喜数值。；historical_review FOMC_MPS_RAW与FOMC_MPS_ORTH均mps_unavailable，缺30分钟公告冲击。；全日SOX/Yahoo与国债收益率/FRED含会前和其他同时信息；无净因果识别。\",\"market_evidence\":[],\"rationale\":\"本次存在两条相反的可证路径：维持利率排除了已被部分计价的当次加息，短端相对缓和；三名加息异议和持续抗通胀沟通则保留未来估值压力。现有证据不足以给SOX净方向排序，结论是有内容的分歧，不能用当天-5.33%倒推利空。\",\"reference_period\":\"2026-07-29\",\"release_date\":\"2026-07-29\",\"released_at_utc\":\"2026-07-29T18:00:00+00:00\",\"review_event_sha256\":\"c0fa98b691d297aeebbddfff743edef433ce0c0c748d8f1264a2b12f0508c92c\",\"reviewed_at_utc\":\"2026-09-08T12:08:13.811473+00:00\",\"scope\":\"事后复盘该次发布对 SOX 的传导判断；不是当时已知预测、净价格因果确证或现行交易建议。\",\"source_quality_notes\":\"\",\"sources\":[{\"public_timing\":\"meeting_day_communication\",\"supports\":\"三名加息异议\",\"title\":\"statement 2026-07-29\",\"url\":\"https://www.federalreserve.gov/newsevents/pressreleases/monetary20260729a.htm\"},{\"public_timing\":\"meeting_day_communication\",\"supports\":\"第1–3页：反通胀承诺与AI投资；无固定政策承诺\",\"title\":\"press 2026-07-29\",\"url\":\"https://www.federalreserve.gov/mediacenter/files/FOMCpresconf20260729.pdf\"},{\"public_timing\":\"post_meeting_minutes\",\"supports\":\"会前当次加息概率与9月定价、Desk调查反差；会后公开\",\"title\":\"minutes 2026-07-29\",\"url\":\"https://www.federalreserve.gov/monetarypolicy/fomcminutes20260729.htm\"}],\"status\":\"missing_evidence\",\"target\":\"^SOX\"},\"id\":\"macro:FOMC_RATE_DECISION:2026-07-29\",\"observation\":\"历史发布记录；当前研究快照不代表事件当时可得信息。\",\"original_date\":\"2026-07-29\",\"research_url\":null,\"sources\":[{\"title\":\"Federal Open Market Committee\",\"url\":\"https://www.federalreserve.gov/newsevents/pressreleases/monetary20260729a.htm\"}],\"stage\":\"已公布\",\"summary\":\"Federal Open Market Committee · 参考期 2026-07-29\",\"title\":\"FOMC · 2026-07-29\"},{\"category\":\"macro\",\"date\":\"2026-08-07\",\"details\":{\"data_quality\":\"verified_actual_consensus_if_available\",\"fetched_at_utc\":\"2026-09-05T13:33:25+00:00\",\"reference_period\":\"2026-07\",\"release_timezone\":\"America/New_York\",\"released_at_utc\":\"2026-08-07T12:30:00+00:00\",\"source_kind\":\"official_or_official_via_FRED\"},\"direction\":\"unknown\",\"direction_basis\":\"已公布事实不自动构成 SOX 利好或利空；尚无通过身份、证据和时点核验的事后研究判断。\",\"direction_kind\":\"unknown\",\"expectations\":[],\"history_assessment\":{\"attribution\":\"VV 事后研究判断；非事件当时预测，非 SOX 净价格因果确证。\",\"channel\":\"缓和加息风险/折现压力\",\"confidence\":\"low\",\"counterevidence\":\"就业转负和大额下修确为需求风险；参与率下滑使失业率下降含义变差。后一个交易日2Y反弹6bp、SOX回吐2.94%，缓和效应不稳定。\",\"direction\":\"bullish\",\"event_id\":\"macro:NONFARM_PAYROLLS_US:2026-07\",\"expectation_qualification\":\"本地历史登记共识，仅为背景；未独立重建公告前调查原始版本，不宣称严格事前冻结或机构共识。9月4日缺精确known_at，尤其不能作合格前瞻surprise。\",\"facts\":\"7月非农首发-2.3万人；失业率4.1%；时薪仅增加2美分、同比+3.2%；前两月合计下修10.3万人；地方教育减少5万人。参与率为61.4%。\",\"institution_interpretation\":\"ABN AMRO Nick Kounis 8月7日认为就业弱势可使Fed从单看通胀转向双重目标，仍预计未来数月不动，但指出高通胀下风险偏向加息。\",\"limits\":\"BLS原发布本轮在线回读；就业方向为研究推断，BLS不提供SOX方向。；本地SOX/FRED端点已本轮逐一回读并重算；未从外部重新获取行情。；单日/五日数据不能排除公司、地缘、能源和仓位消息；未估计因果份额。；7次判断均为事后研究，无法代替当时的预测记录或OOS验证。\",\"market_evidence\":[],\"rationale\":\"VV事后研究判断：短期温和利好SOX估值端，低信心。在当时鹰派政策背景下，就业和工资一起降温为维持利率提供理由；通胀之外的就业风险重新进入政策权衡。这不表示经济基本面改善。\",\"reference_period\":\"2026-07\",\"release_date\":\"2026-08-07\",\"released_at_utc\":\"2026-08-07T12:30:00+00:00\",\"review_event_sha256\":\"dad271c7fe3c895b918f08ec9869b4be39d67cb2e5619b1a2bb7668d397a5fa9\",\"reviewed_at_utc\":\"2026-09-08T12:08:28.001146+00:00\",\"scope\":\"事后复盘该次发布对 SOX 的传导判断；不是当时已知预测、净价格因果确证或现行交易建议。\",\"source_qua ,0)+' 个事件。';\n}\n// 2026-09-16 预期外视觉迭代：悬停信息条内容（纯函数 · 可单测）。\n// 简要人话（Doctor 令·两修）：观察什么 + 机构预期（指标+数值）；有「指标：N percent」式数值的写超/不及阈值，没有就空着。\nfunction hoverInfoFor(e){\n const lines=[];\n if(e.observation)lines.push({k:'观察',v:textOf(e.observation)});\n const exps=(e.expectations||[]).slice(0,4);\n const numRe=/^([^：:]{2,40})[：:]\\s*(\\d+(?:\\.\\d+)?)\\s*percent/;\n if(exps.length){\n  exps.forEach(v=>{lines.push({k:'预期',v:(v.institution?v.institution+'：':'')+textOf(v.text)});});\n  const numExp=exps.find(v=>numRe.test(textOf(v.text)));\n  if(numExp){const m=textOf(numExp.text).match(numRe);\n   lines.push({k:'超预期',v:m[1]+' >'+m[2]+'%'});\n   lines.push({k:'不及预期',v:m[1]+' <'+m[2]+'%'});\n  }\n  if((e.expectations||[]).length>4)lines.push({k:'',v:'等 '+((e.expectations||[]).length-4)+' 条，点击查看全部'});\n }else{\n  lines.push({k:'预期',v:'暂无具名机构预期，点击查看研究要点'});\n  if(e.direction_assessment&&e.direction_assessment.scenario)lines.push({k:'情景',v:e.direction_assessment.scenario});\n }\n if(e.direction_kind==='retrospective'){\n  const a=e.history_assessment;\n  lines.push({k:'复盘',v:a&&a.status==='reviewed'?{bullish:'复盘偏利好',bearish:'复盘偏利空',unknown:'复盘分歧'}[e.direction]:'待复核'});\n }\n return lines;\n}\nfunction truncate(s,n){s=String(s??'');return s.length>n?s.slice(0,n)+'…':s;}\nfunction renderStars(){\n const groups=groupsFor(data,g.days);$('event-layer').replaceChildren();hideHover();\n groups.forEach((group,j)=>{\n  // 统一一横行：所有事件星都排在 K 线上方同一高度；矮页面时钳制在图表区上缘之下（2026-09-16 Doctor 令·二次「再提高」）。\n  const i=g.days.indexOf(group.date),xx=g.x(i),yy=Math.max(g.zero-g.radius-45,g.top+4);\n  const button=document.createElement('button');button.className='star-hit';button.dataset.eventKey=group.key;button.style.setProperty('--star-phase',(-groups.indexOf(group)*1.73)+'s');button.style.left=xx+'px';button.style.top=yy+'px';const nearest=Math.min(42,...groups.filter(o=>o!==group).map(o=>Math.abs(g.x(g.days.indexOf(o.date))-xx)));button.style.width=Math.max(8,Math.min(40,nearest-2))+'px';\n  const categories=[...new Set(group.events.map(e=>e.category))];button.style.setProperty('--star',categories.length===1?COLORS[categories[0]]:'#dfdfed');\n  button.setAttribute('aria-label',group.date+' '+group.events.map(e=>e.title).join('、')+'，'+group.events.map(directionLabel).join('；')+'，悬停查看预期与超/不及预期定义，点击查看详情');\n  const core=document.createElement('span');core.className='star-core';core.setAttribute('aria-hidden','true');\n  const sd=(()=>{let h=0;for(let i=0;i<group.key.length;i++)h=(h*31+group.key.charCodeAt(i))>>>0;return (h%1000)/1000;})();\n  core.style.setProperty('--star-size',(10+sd*4)+'px');core.style.setProperty('--star-core',(4+sd*3)+'%');core.style.setProperty('--star-period',(6.2+sd*2.6)+'s');core.style.setProperty('--star-dot',(1.6+sd*1)+'px');\n  button.append(core);\n  // 2026-09-16 Doctor 令：同日多事件也只显示一颗星（不堆叠）；多事件内容在悬停信息条与点击详情中逐条展示。\n  // 悬停/键盘聚焦：K 线下方信息条显示名称+目前预期+超/不及预期定义（2026-09-16 Doctor 令）。\n  button.addEventListener('pointerenter',()=>showHover(group));\n  button.addEventListener('pointerleave',hideHover);\n  button.addEventListener('focus',()=>showHover(group));\n  button.addEventListener('blur',hideHover);\n  button.addEventListener('click',()=>group.events.length===1?openEvent(group.events[0],button):openList(group.events,group.date+' · '+group.events.length+' 个事件',button));\n  $('event-layer').append(button);\n });\n}\nfunction showHover(group){\n const info=$('hover-info');if(!info)return;\n info.innerHTML=group.events.map(e=>'<div class=\"hi-event\"><p class=\"hi-title\">'+esc(e.title)+(e.direction_kind==='conditional'?'*':'')+'<\/p>'+hoverInfoFor(e).map(l=>'<p class=\"hi-line\">'+(l.k?'<span class=\"hi-k'+(l.k==='超预期'?' tag-above':l.k==='不及预期'?' tag-below':'')+'\">'+esc(l.k)+'<\/span>':'')+esc(truncate(l.v,110))+'<\/p>').join('')+'<\/div>').join('');\n info.style.bottom=(g.height-g.tickY+18)+'px';\n info.classList.add('show');\n}\nfunction hideHover(){const info=$('hover-info');if(info)info.classList.remove('show');}\nfunction setIndex(next){if(n  }
