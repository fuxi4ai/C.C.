b','谨慎':'#c0662a','':'#9a9386'};\nconst GLOW={healthy:null,stale:'#c8962a',needs_repair:'#e8731e',orphan:'#9a9386'};\nconst PBK={run:'#3aa676',watch:'#8a6fd4',cost:'#3f72b0'};\n\nconst wan=v=>(v/1e4).toFixed(1)+'万';\nconst signWan=v=>(v>=0?'+':'−')+Math.abs(v/1e4).toFixed(1)+'万';\nconst nz=(x,d=2)=>x==null?'—':(+x).toFixed(d);\nconst r1=x=>Math.round(x*10)/10;\nconst today=()=>new Date().toISOString().slice(0,10);\n\nconst board=document.getElementById('board'), panel=document.getElementById('panel');\nlet cur='status', curNode=null;\n\n/* —— 前端派生：价/市值/成本利润条（币种自适应：港股按港币算比例、按汇率折¥） —— */\nfunction computeDerived(n){\n  const price = n.hk ? n.px_hkd : (n.px_a != null ? n.px_a : n.px_manual);    // 原币种价（A股¥自动 / 港股HK$手录 / 无本地行情标的手录px_manual）\n  n.price = price;\n  if(price==null){ n.mktval=null; n.cost_amt=null; n.profit=null; n.bar={mode:'noprice'}; return; }\n  const mvN=n.shares*price, caN=n.shares*n.cost, k=n.hk?RATE:1;\n  n.mktval=mvN*k; n.cost_amt=caN*k; n.profit=(mvN-caN)*k;   // 折¥\n  if(n.cost<0) n.bar={mode:'allprofit'};\n  else if(mvN>=caN){ const cp=mvN?caN/mvN*100:0; n.bar={mode:'profit',cost_pct:r1(cp),profit_pct:r1(100-cp)}; }\n  else n.bar={mode:'loss',loss_pct:mvN?r1((caN-mvN)/mvN*100):0};\n}\nfunction recomputeAll(){ nodes.forEach(computeDerived); }\n\nfunction pill(k,v,cls){ return '<div class=\"stat-pill\"><span class=\"k\">'+k+'<\/span><span class=\"v'+(cls?' '+cls:'')+'\">'+v+'<\/span><\/div>'; }\nfunction renderSummary(){\n  const priced=nodes.filter(n=>n.mktval!=null);\n  const tot_mv=priced.reduce((s,n)=>s+n.mktval,0);\n  const tot_profit=priced.reduce((s,n)=>s+n.profit,0);\n  document.getElementById('summary').innerHTML =\n    pill('持仓', meta.n_total+' 只') +\n    pill('总市值(折¥)', wan(tot_mv)) +\n    '<div class=\"stat-pill click\" onclick=\"event.stopPropagation();openCash()\" title=\"点击编辑三账户额度\"><span class=\"k\">现金<\/span><span class=\"v cash\">'+wan(meta.cash)+' <span class=\"pen\">✎<\/span><\/span><\/div>' +\n    pill('总资产', wan(tot_mv+meta.cash)) +\n    pill('账面浮盈', signWan(tot_profit), tot_profit>=0?'up':'down');\n}\ndocument.getElementById('disc').innerHTML =\n  '静态快照 · A股价 as of '+meta.asof_px+' · 生成 '+meta.gen_at+' · 价源 <code>公共行情库<\/code>＋龙鱼库 · 港元汇率 '+(+RATE).toFixed(4)+'（'+meta.rate_asof+'，编辑器可改）。'+\n  '成本=券商摊薄成本(止盈可负)。港股市值＝股数×港币价×汇率(折¥)。龙鱼产业信号 · <b>非投资建议<\/b>。';\ndocument.getElementById('footer').innerHTML =\n  '生成器 <code>build_holdings_board.py<\/code> · 数据/版式解耦。面板「编辑」可改股数/成本、港股录当日价(HK$)——「保存并刷新」直写 holdings.json(自动备份)并重跑；无服务时用「复制JSON」粘回。账面浮盈＝相对摊薄成本(含负成本口径)。';\n\nfunction barHTML(n){\n  const b=n.bar;\n  if(b.mode==='noprice') return '<div class=\"cc-noq\" style=\"font-size:10.5px;color:#b19a6b;margin-top:8px\">港股 · 本地无行情<\/div>';\n  let track='', lb='';\n  if(b.mode==='allprofit'){\n    track='<div class=\"seg prof\" style=\"width:100%\"><\/div>';\n    lb='<span class=\"lp\">负成本 · 纯利润<\/span>';\n  } else if(b.mode==='profit'){\n    track='<div class=\"seg cost\" style=\"width:'+b.cost_pct+'%\"><\/div><div class=\"seg prof\" style=\"width:'+b.profit_pct+'%\"><\/div>';\n    lb='<span class=\"lc\">成本 '+b.cost_pct+'%<\/span><span class=\"lp\">利润 '+b.profit_pct+'%<\/span>';\n  } else { /* loss */\n    track='<div class=\"seg cost\" style=\"width:100%\"><\/div>';\n    lb='<span class=\"lc\">成本 ≥ 市值<\/span><span class=\"ll\">浮亏 -'+b.loss_pct+'%<\/span>';\n  }\n  const over=(b.mode==='loss')?'<div class=\"bar-over\" style=\"width:'+Math.min(b.loss_pct,100)+'%\"><\/div>':'';\n  return '<div class=\"barwrap\"><div class=\"bar-track\">'+track+'<\/div>'+over+'<div class=\"bar-lb\">'+lb+'<\/div><\/div>';\n}\n\nfunction render(g){\n  cur=g; board.innerHTML='';\n  const G=GROUPS[g];\n  document.querySelectorAll('#grp button').forEach(b=>b.classList.toggle('on',b.dataset.g===g));\n  // color legend\n  document.getElementById('lg-color').innerHTML='<span class=\"lgt\">色 = '+G.label+'<\/span>'+\n    G.order.filter(k=>nodes.some(n=>G.key(n)===k)).map(k=>\n      '<span class=\"li\"><span class=\"kc\" style=\"background:'+G.color[k]+'\"><\/span>'+k+'<\/span>').join('');\n  // group\n  const keys=[...G.order]; nodes.forEach(n=>{const k=G.key(n); if(!keys.includes(k))keys.push(k);});\n  keys.forEach(k=>{\n    const items=nodes.filter(n=>G.key(n)===k); if(!items.length) return;\n    items.sort((a,b)=>((b.mktval==null?-1e18:b.mktval)-(a.mktval==null?-1e18:a.mktval)));   // 桶内按市值降序(所有分组)；无价(mktval null)沉底\n    const col=G.color[k]||'#9aa4b8';\n    const sec=document.createElement('div'); sec.className='row';\n    const lab=document.createElement('div'); lab.className='row-label'; lab.style.setProperty('--rc',col);\n    lab.innerHTML=k+' <span class=\"cnt\">· '+items.length+' 只<\/span>'+(G.desc[k]?' <span class=\"desc\">'+G.desc[k]+'<\/span>':'');\n    sec.appendChild(lab);\n    const cs=document.createElement('div'); cs.className='cards';\n    items.forEach(n=>{\n      const c=document.createElement('div'); c.className='card';\n      c.dataset.code=n.code; c.dataset.st=n.health;\n      c.style.setProperty('--sc',col);\n      c.style.setProperty('--stcol',RTCOL[n.rating]||'#9a9386');\n      if(GLOW[n.health]) c.style.setProperty('--glow',GLOW[n.health]);\n      const totH=n.total!=null?('<span class=\"tot\">'+n.total+'<\/span><span class=\"rt\">'+n.rating+'<\/span>')\n                              :('<span class=\"tot na\">—<\/span><span class=\"rt\">待评<\/span>');\n      const mt=n.hk?'港股 · engine 不覆盖':((n.seg?n.seg+'｜':'')+(n.track||'—'));\n      let pxH;\n      if(n.price==null){ pxH='<span class=\"noq\">'+(n.hk?'港股 · 点开录当日价':'本地无行情')+'<\/span>'; }\n      else { const pt=n.hk?('HK$'+nz(n.price)):nz(n.price); pxH='<span class=\"pr\">'+pt+'<\/span><span class=\"mv\">市值 '+wan(n.mktval)+'<\/span>'; }\n      const pnl=(n.profit==null)?'':('<div class=\"pnl '+(n.profit>=0?'up':'down')+'\">账面 '+signWan(n.profit)+'<\/div>');\n      c.innerHTML='<div class=\"neb\"><\/div><div class=\"stars\"><\/div><div class=\"cc\">'+\n        '<div class=\"nm\">'+n.name+' <span class=\"code\">'+n.code+'<\/span>'+(n.hk?' <span class=\"hk\">HK<\/span>':'')+'<\/div>'+\n        '<div class=\"mt\">'+mt+'<\/div>'+\n        '<div class=\"score\">'+totH+'<\/div>'+\n        '<div class=\"px\">'+pxH+'<\/div>'+\n        barHTML(n)+ pnl +\n        '<\/div>';\n      c.addEventListener('click',e=>{e.stopPropagation();openCard(n);});\n      cs.appendChild(c);\n    });\n    sec.appendChild(cs); board.appendChild(sec);\n  });\n}\n\nfunction openCard(n){\n  curNode=n;\n  let six='';\n  if(n.six){\n    six='<div class=\"sec\"><div class=\"h\">龙鱼六维（总分 '+n.total+' · '+n.rating+'）<\/div>';\n    for(const k in n.six){ const v=n.six[k]; const m=k.match(/\\((\\d+(?:\\.\\d+)?)\\)/); const max=m?parseFloat(m[1]):1;\n      const pct=Math.max(0,Math.min(100,v/max*100)); const lb=k.replace(/\\(\\d+(?:\\.\\d+)?\\)/,'');\n      six+='<div class=\"barj\"><div class=\"bl\"><span>'+lb+'<\/span><span>'+v+' / '+max+'<\/span><\/div><div class=\"bt\"><div class=\"bf\" style=\"width:'+pct+'%\"><\/div><\/div><\/div>';\n    }\n    six+='<\/div>';\n  } else six='<div class=\"sec\"><div class=\"h\">龙鱼评分<\/div>港股 · engine 不覆盖，六维待手工补。<\/div>';\n  let mvH;\n  if(n.mktval==null){ mvH='<div class=\"kv\"><span class=\"kk\">当日价 / 市值<\/span><span class=\"vv\">'+(n.hk?'港股·未录价':'本地无行情')+'<\/span><\/div>'; }\n  else{ const pl=n.hk?'当日价(HK$)':'最新价', pv=n.hk?('HK$'+nz(n.price)):nz(n.price), ml=n.hk?'市值(折¥)':'持仓市值';\n    mvH='<div class=\"kv\"><span class=\"kk\">'+pl+'<\/span><span class=\"vv\">'+pv+'<\/span><\/div>'+\n        '<div class=\"kv\"><span class=\"kk\">'+ml+'<\/span><span class=\"vv\">'+wan(n.mktval)+'<\/span><\/div>'+\n        '<div class=\"kv\"><span class=\"kk\">账面浮盈<\/span><span class=\"vv '+(n.profit>=0?'up':'down')+'\">'+signWan(n.profit)+'<\/span><\/div>'; }\n  panel.innerHTML='<span class=\"close\" onclick=\"panel.classList.remove(\\'open\\')\">✕<\/span>'+\n    '<h3>'+n.name+' <span class=\"code\">'+n.code+'<\/span><\/h3>'+\n    '<div class=\"kindt\">'+n.status_cn+' · '+(n.seg?n.seg+'｜':'')+(n.track||'港股')+'<\/div>'+\n    '<span class=\"pb\" style=\"background:'+(PBK[n.kind]||'#888')+'\">'+n.status_cn+'<\/span>'+\n    '<span class=\"pb\" style=\"background:'+(RTCOL[n.rating]||'#9a9386')+'\">'+(n.total!=null?(n.total+' '+n.rating):'待评')+'<\/span>'+\n    '<div class=\"sec\"><div class=\"h\">持仓 <button class=\"edit-btn\" onclick=\"openEdit(curNode)\">编辑<\/button><\/div>'+\n      '<div class=\"kv\"><span class=\"kk\">持股<\/span><span class=\"vv\">'+n.shares.toLocaleString()+' 股<\/span><\/div>'+\n      '<div class=\"kv\"><span class=\"kk\">摊薄成本<\/span><span class=\"vv\">'+n.cost+(n.hk?' HK$':'')+'<\/span><\/div>'+\n      mvH+'<\/div>'+\n    '<div class=\"sec\"><div class=\"h\">成本 / 利润（占市值）<\/div>'+barHTML(n)+'<\/div>'+\n    six;\n  panel.classList.add('open');\n}\n\n/* —— 面板内联编辑器 —— */\nfunction edRow(label,id,val,step,unit){\n  return '<div class=\"ed-row\"><label>'+label+'<\/label><span class=\"ed-inp\"><input id=\"'+id+'\" type=\"number\" step=\"'+step+'\" value=\"'+val+'\"><span class=\"ed-unit\">'+unit+'<\/span><\/span><\/div>';\n}\nfunction gv(id){ const el=document.getElementById(id); return el?el.value.trim():''; }\nfunction openEdit(n){\n  curNode=n; const hk=n.hk; const noAuto=(!hk && n.px_a==null);   // 无本地行情的非港股(如ETF)→手录价\n  panel.innerHTML='<span class=\"close\" onclick=\"panel.classList.remove(\\'open\\')\">✕<\/span>'+\n    '<h3>'+n.name+' <span class=\"code\">'+n.code+'<\/span><\/h3>'+\n    '<div class=\"kindt\">编辑持仓 · 改完「应用」即页内重算<\/div>'+\n    '<div class=\"sec\"><div class=\"h\">最新持仓<\/div>'+\n      edRow('股数','ed-shares',n.shares,'1','股')+\n      edRow('摊薄成本','ed-cost',n.cost,'any',hk?'HK$':'¥')+\n      (hk?(edRow('当日价','ed-pxhkd',(n.px_hkd==null?'':n.px_hkd),'any','HK$')+\n           edRow('港元汇率','ed-rate',(+RATE).toFixed(4),'0.0001','→¥')):'')+\n      (noAuto?edRow('当日价/净值','ed-pxman',(n.px_manual==null?'':n.px_manual),'any','¥'):'')+\n    '<\/div>'+\n    '<div class=\"ed-actions\">'+\n      '<button class=\"ed-btn primary\" onclick=\"saveAndRefresh(this)\">保存并刷新<\/button>'+\n      '<button class=\"ed-btn\" onclick=\"applyEdit()\">仅试算<\/button>'+\n      '<button class=\"ed-btn\" onclick=\"exportJSON()\">复制JSON<\/button>'+\n      '<button class=\"ed-btn\" onclick=\"openCard(curNode)\">取消<\/button>'+\n    '<\/div><div id=\"ed-out\"><\/div>';\n  panel.classList.add('open');\n}\nfunction readInputsInto(n){\n  const s=gv('ed-shares'), c=gv('ed-cost');\n  if(s!=='') n.shares=+s;\n  if(c!=='') n.cost=+c;\n  if(n.hk){ const p=gv('ed-pxhkd'); n.px_hkd=(p===''?null:+p); const rr=gv('ed-rate'); if(rr!=='') RATE=+rr; }\n  if(!n.hk){ const el=document.getElementById('ed-pxman'); if(el){ const pm=el.value.trim(); n.px_manual=(pm===''?null:+pm); } }\n}\nfunction applyEdit(){ readInputsInto(curNode); recomputeAll(); renderSummary(); render(cur); openCard(curNode); }\nfunction buildHoldingsObj(){\n  const mr=JSON.parse(JSON.stringify(DATA.meta_raw));\n  mr.updated=today(); mr.hkd_cny_rate=+(+RATE).toFixed(4); mr.hkd_cny_asof=today();\n  const byCode={}; nodes.forEach(n=>byCode[n.code]=n);\n  const hs=DATA.holdings_raw.map(h=>{ const n=byCode[h.ts_code]; const o=Object.assign({},h);\n    if(n){ o.shares=n.shares; o.cost=n.cost; if(n.hk&&n.px_hkd!=null){ o.px_hkd=n.px_hkd; o.px_asof=today(); } if(!n.hk&&n.px_manual!=null){ o.px_manual=n.px_manual; o.px_asof=today(); } }\n    return o; });\n  return {_meta:mr, holdings:hs};\n}\nfunction edMsg(html,err){ document.getElementById('ed-out').innerHTML='<div style=\"font-size:11px;margin:8px 0;color:'+(err?'#c0392b':'var(--sub)')+'\">'+html+'<\/div>'; }\nasync function saveAndRefresh(btn){\n  readInputsInto(curNode); recomputeAll(); renderSummary(); render(cur);\n  if(location.protocol!=='http:'){ edMsg('无本地服务：改用下方「复制JSON」粘回 holdings.json。',true); return exportJSON(); }\n  const old=btn.textContent; btn.disabled=true; btn.textContent='保存中…';\n  try{\n    const r=await fetch('/api/save-holdings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(buildHoldingsObj())});\n    const j=await r.json();\n    if(j.ok){ btn.textContent='已保存 ✓ 刷新中…'; edMsg((j.msg||'').split('\\n').pop()); setTimeout(()=>location.reload(),600); }\n    else{ btn.disabled=false; btn.textContent=old; edMsg('保存失败：'+(j.msg||''),true); }\n  }catch(e){ btn.disabled=false; btn.textContent=old; edMsg('保存失败：'+e,true); }\n}\nfunction exportJSON(){\n  const txt=JSON.stringify(buildHoldingsObj(), null, 2);\n  window.__exp=txt;\n  document.getElementById('ed-out').innerHTML=\n    '<textarea class=\"ed-export\" readonly>'+txt.replace(/<\/g,'&lt;')+'<\/textarea>'+\n    '<div style=\"display:flex;gap:8px;margin-top:6px;align-items:center\"><button class=\"ed-btn primary\" onclick=\"copyOut(this)\">复制到剪贴板<\/button>'+\n    '<span style=\"font-size:10.5px;color:var(--sub)\">粘回 holdings.json 覆盖，即同步真源<\/span><\/div>';\n}\nfunction copyOut(btn){ navigator.clipboard.writeText(window.__exp||'').then(()=>{btn.textContent='已复制 ✓';setTimeout(()=>btn.textContent='复制到剪贴板',1500);}); }\n\n/* —— 一键刷新：POST 本地服务重跑生成器（仅本地服务模式可用） —— */\nasync function refreshBoard(btn){\n  const note=document.getElementById('refreshNote'); note.className='refresh-note'; note.textContent='';\n  if(location.protocol!=='http:'){\n    note.className='refresh-note err';\n    note.textContent='需用「启动看板.command」打开(本地服务模式)才能一键刷新;当前是直接打开文件。';\n    return;\n  }\n  const old=btn.textContent; btn.disabled=true; btn.textContent='刷新中…';\n  try{\n    const r=await fetch('/api/refresh',{method:'POST'});\n    const j=await r.json();\n    if(j.ok){ btn.textContent='已刷新 ✓'; note.textContent=(j.msg||'').split('\\n').pop(); setTimeout(()=>location.reload(),500); }\n    else{ btn.disabled=false; btn.textContent=old; note.className='refresh-note err'; note.textContent='刷新失败：'+(j.msg||''); }\n  }catch(e){ btn.disabled=false; btn.textContent=old; note.className='refresh-note err'; note.textContent='刷新失败：'+e; }\n}\n\n/* —— 顶部按钮按打开方式自适应：服务模式=刷新；file://=打开所在文件夹 —— */\nfunction openFolder(){\n  const url=location.href.replace(/[?#].*$/,'').replace(/[^\\/]*$/,'');   // 去掉文件名→本文件夹URL\n  const note=document.getElementById('refreshNote');\n  const w=window.open(url,'_blank');\n  if(!w){ note.className='refresh-note err'; note.textContent='浏览器拦了弹窗 · 手动到此文件夹双击「启动看板.command」：'+decodeURIComponent(url.replace(/^file:\\/\\//,'')); }\n  else{ note.className='refresh-note'; note.textContent='已打开文件夹 · 双击「启动看板.command」启动服务后即可一键刷新'; }\n}\nfunction initTopBtn(){\n  const btn=document.getElementById('refreshBtn');\n  if(location.protocol==='http:'){ btn.textContent='⟳ 刷新'; btn.title='重跑生成器并刷新'; btn.onclick=()=>refreshBoard(btn); }\n  else{ btn.textContent='📂 打开文件夹'; btn.title='当前是直接打开文件(无服务)；点此打开所在文件夹，双击「启动看板.command」启动服务后即可一键刷新'; btn.onclick=()=>openFolder(); }\n}\n\n/* —— 现金三账户编辑（存回走本地服务 /api/save-holdings） —— */\nfunction cashAcctBase(){\n  return (meta.cash_accounts && meta.cash_accounts.length) ? meta.cash_accounts\n    : [{name:'太平洋证券',amount:0},{name:'招商证券',amount:0},{name:'招商证券两融',amount:0}];\n}\nfunction edRowCash(name,id,val){\n  return '<div class=\"ed-row\"><label>'+name+'<\/label><span class=\"ed-inp\"><input id=\"'+id+'\" type=\"number\" step=\"0.01\" value=\"'+(val!=null?val:0)+'\"><span class=\"ed-unit\">¥<\/span><\/span><\/div>';\n}\nfunction currentAccts(){ return cashAcctBase().map((a,i)=>({name:a.name, amount:+(gv('cash-'+i)||0)})); }\nfunction updateCashSum(){ const s=currentAccts().reduce((x,a)=>x+(a.amount||0),0); const el=document.getElementById('cash-sum'); if(el) el.textContent=wan(s)+'（¥'+s.toLocaleString(undefined,{maximumFractionDigits:2})+'）'; }\nfunction openCash(){\n  const accts=cashAcctBase();\n  const rows=accts.map((a,i)=>edRowCash(a.name,'cash-'+i,a.amount)).join('');\n  panel.innerHTML='<span class=\"close\" onclick=\"panel.classList.remove(\\'open\\')\">✕<\/span>'+\n    '<h3>现金账户<\/h3>'+\n    '<div class=\"kindt\">三账户额度 · 合计即总现金，「保存」写回 holdings.json<\/div>'+\n    '<div class=\"sec\"><div class=\"h\">账户额度（元）<\/div>'+rows+\n      '<div class=\"kv\" style=\"margin-top:8px\"><span class=\"kk\">合计<\/span><span class=\"vv\" id=\"cash-sum\">…<\/span><\/div><\/div>'+\n    '<div class=\"ed-actions\"><button class=\"ed-btn primary\" onclick=\"saveCash(this)\">保存<\/button>'+\n      '<button class=\"ed-btn\" onclick=\"panel.classList.remove(\\'open\\')\">取消<\/button><\/div><div id=\"ed-out\"><\/div>';\n  panel.classList.add('open');\n  updateCashSum();\n  accts.forEach((a,i)=>{ const el=document.getElementById('cash-'+i); if(el) el.addEventListener('input',updateCashSum); });\n}\nasync function saveCash(btn){\n  const accts=currentAccts();\n  const obj=buildHoldingsObj(); obj._meta.cash_accounts=accts;\n  if(location.protocol!=='http:'){ edMsg('无本地服务：用「启动看板.command」打开后再存，或在 Cowork artifact 里改。',true); return; }\n  const old=btn.textContent; btn.disabled=true; btn.textContent='保存中…';\n  try{\n    const r=await fetch('/api/save-holdings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(obj)});\n    const j=await r.json();\n    if(j.ok){ btn.textContent='已保存 ✓ 刷新中…'; setTimeout(()=>location.reload(),600); }\n    else{ btn.disabled=false; btn.textContent=old; edMsg('保存失败：'+(j.msg||''),true); }\n  }catch(e){ btn.disabled=false; btn.textContent=old; edMsg('保存失败：'+e,true); }\n}\n\ndocument.querySelectorAll('#grp button').forEach(b=>b.addEventListener('click',()=>render(b.dataset.g)));\npanel.addEventListener('click',e=>e.stopPropagation());   // 面板内交互不误触关闭\ndocument.addEventListener('click',()=>panel.classList.remove('open'));\nrecomputeAll(); renderSummary(); render('status'); initTopBtn();\n<\/script>\n<\/body>\n<\/html>";
let _holdLoaded=false;
function mountHold(){
  if(_holdLoaded) return;
  const f=document.getElementById('holdframe');
  if(!f) return;
  if(!HOLDINGS_HTML){ f.removeAttribute('srcdoc'); _holdLoaded=true; return; }
  f.srcdoc=HOLDINGS_HTML; _holdLoaded=true;
}
function switchTab(t){
  document.body.dataset.tab=t;   // 供标签栏文字随页面配色（body[data-tab=hold] 换深字）
  document.querySelectorAll('.tabs .tab-btn').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
  document.getElementById('page-lib').classList.toggle('off',t!=='lib');
  document.getElementById('page-hold').classList.toggle('off',t!=='hold');
  if(t==='hold') mountHold();
}
document.querySelectorAll('.tabs .tab-btn').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.tab)));
const DATA = PAYLOAD.records;

function sectorOf(ind){
  const s=ind||'';
  if(/半导体|射频|微波|LED|化合物|集成电路/.test(s)) return '半导体';
  if(/光通信|光器件|微纳光学|3D视觉|光学/.test(s)) return '光通信/光电';
  if(/PCB|覆铜板|CCL|电子材料|矿物制品/.test(s)) return '电子材料/PCB';
  if(/元器件|天线|传动|连接器/.test(s)) return '元器件';
  if(/通信|导航|空天信息/.test(s)) return '通信';
  if(/航天|军工/.test(s)) return '航天军工';
  if(/机械|电镀设备|化工机械/.test(s)) return '机械设备';
  if(/小金属|稀土|铜|黄金|石油|有色|化工原料/.test(s)) return '资源/材料';
  if(/光伏|新能源|储能/.test(s)) return '新能源';
  return '其他';
}

function groupsOf(list){
  const g={};
  if(grp==='rating'){ RATING_ORDER.forEach(r=>g[r]=[]); list.forEach(d=>{(g[d.rating]=g[d.rating]||[]).push(d);});
    return RATING_ORDER.filter(r=>g[r]&&g[r].length).map(r=>({en:REN[r]||r,cn:'评级 · '+r,color:RCOL[r]||'#888',items:g[r]})); }
  if(grp==='sector'){ list.forEach(d=>{(g[d.sector]=g[d.sector]||[]).push(d);});
    return Object.keys(SECTORS).filter(s=>g[s]).map(s=>({en:SEC_EN[s]||s,cn:'行业 · '+s,color:SECTORS[s],items:g[s]})); }
  list.forEach(d=>{const t=d.track||'（未分赛道）'; (g[t]=g[t]||[]).push(d);});
  return Object.keys(g).sort((a,b)=>g[b].length-g[a].length).map(t=>({en:'Track',cn:'赛道 · '+t,color:'#B39DFF',items:g[t]}));

function card(d){

  if(risk==='low' && typeof finS==='number' && finS<=FIN_MAX) risk='finrisk';
  const w=document.createElement('div'); w.className='cardw';
  const c=document.createElement('div'); c.className='card';
  c.style.setProperty('--sc',sc); c.style.setProperty('--rcol',RCOL[d.rating]||'#888');

    '<div class="r2"><span class="indtag">'+(d.seg||d.sector)+'</span><span class="rbadge">'+d.rating+'</span></div></div>';

    badges.push('<div class="flag arw" style="--fc:'+ac+'" title="'+at+'"><svg class="tri" viewBox="0 0 10 10">'+tri+'</svg></div>'); }
  if(badges.length){ const bs=document.createElement('div'); bs.className='flags'; bs.innerHTML=badges.join(''); w.appendChild(bs); }

function render(){
  let list=DATA.filter(d=>!secOff.has(d.sector) && (!query||d._q.includes(query)) && (showOndemand||CHANGGENG.has(d.ts)));
  board.innerHTML=''; const groups=groupsOf(list);

  if(!list.length){ board.innerHTML='<div class="empty">没有匹配的标的</div>'; return; }
  groups.forEach(gr=>{
    const sec=document.createElement('div'); sec.className='row';
    const lab=document.createElement('div'); lab.className='row-label';
    lab.innerHTML='<span class="bar-i" style="--rc:'+gr.color+'"></span><span class="en">'+gr.en+'</span><span class="cn">'+gr.cn+'</span><span class="cnt">'+gr.items.length+'</span>';
    sec.appendChild(lab);
    const cs=document.createElement('div'); cs.className='cards';
    gr.items.sort((a,b)=>(b.total||0)-(a.total||0)).forEach(d=>cs.appendChild(card(d)));
    sec.appendChild(cs); board.appendChild(sec);
  });
}

    '<h3>'+(d.hold?'<span class="cc"><span class="hd" style="display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--moon);margin-right:7px;box-shadow:0 0 6px var(--moon)"></span></span>':'')+d.name+'</h3>'+
    '<div class="pcode">'+d.ts+' · 分析日 '+(d.date||'')+(d.scorer?' · '+d.scorer:'')+(d.hold&&d.since?' · 持仓（'+d.since+'建仓）':'')+'</div>'+
    '<div class="ptags"><span class="indtag" style="--sc:'+sc+'">'+(d.seglabel||d.sector)+'</span>'+
    (d.track?'<span class="indtag" style="--sc:#B39DFF">'+d.track+'</span>':'')+'</div>'+
    '<div class="pscore"><span class="big" style="--rcol:'+(RCOL[d.rating]||'#D6DEE8')+';color:'+(RCOL[d.rating]||'#D6DEE8')+'">'+(d.total??'—')+'</span><span class="of">/ 100 · '+d.rating+'</span></div>'+
    '<div class="h"><span>Six Forces</span><span class="cn">六维拆解</span></div>'+dims+
    (facts?'<div class="h"><span>Engine</span><span class="cn">引擎实测（财务/估值）</span>'+finWarn+'</div><div class="facts">'+facts+'</div>':'')+
    '<div class="h"><span>Thesis</span><span class="cn">一句话判断</span></div><div class="thesis">'+(d.thesis||'—')+'</div>'+ressec+hist+kl;
  panel.classList.add('open'); scrim.classList.add('open');
}
function closeP(){ panel.classList.remove('open'); scrim.classList.remove('open'); }
scrim.addEventListener('click',closeP);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeP();});
