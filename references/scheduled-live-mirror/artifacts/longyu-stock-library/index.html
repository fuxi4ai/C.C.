und:'+G.color[k]+'\"><\/span>'+k+'<\/span>').join('');\n  // group\n  const keys=[...G.order]; nodes.forEach(n=>{const k=G.key(n); if(!keys.includes(k))keys.push(k);});\n  keys.forEach(k=>{\n    const items=nodes.filter(n=>G.key(n)===k); if(!items.length) return;\n    items.sort((a,b)=>((b.mktval==null?-1e18:b.mktval)-(a.mktval==null?-1e18:a.mktval)));   // 桶内按市值降序(所有分组)；无价(mktval null)沉底\n    const col=G.color[k]||'#9aa4b8';\n    const sec=document.createElement('div'); sec.className='row';\n    const lab=document.createElement('div'); lab.className='row-label'; lab.style.setProperty('--rc',col);\n    lab.innerHTML=k+' <span class=\"cnt\">· '+items.length+' 只<\/span>'+(G.desc[k]?' <span class=\"desc\">'+G.desc[k]+'<\/span>':'');\n    sec.appendChild(lab);\n    const cs=document.createElement('div'); cs.className='cards';\n    items.forEach(n=>{\n      const c=document.createElement('div'); c.className='card';\n      c.dataset.code=n.code; c.dataset.st=n.health;\n      c.style.setProperty('--sc',col);\n      c.style.setProperty('--stcol',RTCOL[n.rating]||'#9a9386');\n      if(GLOW[n.health]) c.style.setProperty('--glow',GLOW[n.health]);\n      const totH=n.total!=null?('<span class=\"tot\">'+n.total+'<\/span><span class=\"rt\">'+n.rating+'<\/span>')\n                              :('<span class=\"tot na\">—<\/span><span class=\"rt\">待评<\/span>');\n      const mt=n.hk?'港股 · engine 不覆盖':((n.seg?n.seg+'｜':'')+(n.track||'—'));\n      let pxH;\n      if(n.price==null){ pxH='<span class=\"noq\">'+(n.hk?'港股 · 点开录当日价':'本地无行情')+'<\/span>'; }\n      else { const pt=n.hk?('HK$'+nz(n.price)):nz(n.price); pxH='<span class=\"pr\">'+pt+'<\/span><span class=\"mv\">市值 '+wan(n.mktval)+'<\/span>'; }\n      const pnl=(n.profit==null)?'':('<div class=\"pnl '+(n.profit>=0?'up':'down')+'\">账面 '+signWan(n.profit)+'<\/div>');\n      c.innerHTML='<div class=\"neb\"><\/div><div class=\"stars\"><\/div><div class=\"cc\">'+\n        '<div class=\"nm\">'+n.name+' <span class=\"code\">'+n.code+'<\/span>'+(n.hk?' <span class=\"hk\">HK<\/span>':'')+'<\/div>'+\n        '<div class=\"mt\">'+mt+'<\/div>'+\n        '<div class=\"score\">'+totH+'<\/div>'+\n        '<div class=\"px\">'+pxH+'<\/div>'+\n        barHTML(n)+ pnl +\n        '<\/div>';\n      c.addEventListener('click',e=>{e.stopPropagation();openCard(n);});\n      cs.appendChild(c);\n    });\n    sec.appendChild(cs); board.appendChild(sec);\n  });\n}\n\nfunction openCard(n){\n  curNode=n;\n  let six='';\n  if(n.six){\n    six='<div class=\"sec\"><div class=\"h\">龙鱼六维（总分 '+n.total+' · '+n.rating+'）<\/div>';\n    for(const k in n.six){ const v=n.six[k]; const m=k.match(/\\((\\d+(?:\\.\\d+)?)\\)/); const max=m?parseFloat(m[1]):1;\n      const pct=Math.max(0,Math.min(100,v/max*100)); const lb=k.replace(/\\(\\d+(?:\\.\\d+)?\\)/,'');\n      six+='<div class=\"barj\"><div class=\"bl\"><span>'+lb+'<\/span><span>'+v+' / '+max+'<\/span><\/div><div class=\"bt\"><div class=\"bf\" style=\"width:'+pct+'%\"><\/div><\/div><\/div>';\n    }\n    six+='<\/div>';\n  } else six='<div class=\"sec\"><div class=\"h\">龙鱼评分<\/div>港股 · engine 不覆盖，六维待手工补。<\/div>';\n  let mvH;\n  if(n.mktval==null){ mvH='<div class=\"kv\"><span class=\"kk\">当日价 / 市值<\/span><span class=\"vv\">'+(n.hk?'港股·未录价':'本地无行情')+'<\/span><\/div>'; }\n  else{ const pl=n.hk?'当日价(HK$)':'最新价', pv=n.hk?('HK$'+nz(n.price)):nz(n.price), ml=n.hk?'市值(折¥)':'持仓市值';\n    mvH='<div class=\"kv\"><span class=\"kk\">'+pl+'<\/span><span class=\"vv\">'+pv+'<\/span><\/div>'+\n        '<div class=\"kv\"><span class=\"kk\">'+ml+'<\/span><span class=\"vv\">'+wan(n.mktval)+'<\/span><\/div>'+\n        '<div class=\"kv\"><span class=\"kk\">账面浮盈<\/span><span class=\"vv '+(n.profit>=0?'up':'down')+'\">'+signWan(n.profit)+'<\/span><\/div>'; }\n  panel.innerHTML='<span class=\"close\" onclick=\"panel.classList.remove(\\'open\\')\">✕<\/span>'+\n    '<h3>'+n.name+' <span class=\"code\">'+n.code+'<\/span><\/h3>'+\n    '<div class=\"kindt\">'+n.status_cn+' · '+(n.seg?n.seg+'｜':'')+(n.track||'港股')+'<\/div>'+\n    '<span class=\"pb\" style=\"background:'+(PBK[n.kind]||'#888')+'\">'+n.status_cn+'<\/span>'+\n    '<span class=\"pb\" style=\"background:'+(RTCOL[n.rating]||'#9a9386')+'\">'+(n.total!=null?(n.total+' '+n.rating):'待评')+'<\/span>'+\n    '<div class=\"sec\"><div class=\"h\">持仓 <button class=\"edit-btn\" onclick=\"openEdit(curNode)\">编辑<\/button><\/div>'+\n      '<div class=\"kv\"><span class=\"kk\">持股<\/span><span class=\"vv\">'+n.shares.toLocaleString()+' 股<\/span><\/div>'+\n      '<div class=\"kv\"><span class=\"kk\">摊薄成本<\/span><span class=\"vv\">'+n.cost+(n.hk?' HK$':'')+'<\/span><\/div>'+\n      mvH+'<\/div>'+\n    '<div class=\"sec\"><div class=\"h\">成本 / 利润（占市值）<\/div>'+barHTML(n)+'<\/div>'+\n    six;\n  panel.classList.add('open');\n}\n\n/* —— 面板内联编辑器 —— */\nfunction edRow(label,id,val,step,unit){\n  return '<div class=\"ed-row\"><label>'+label+'<\/label><span class=\"ed-inp\"><input id=\"'+id+'\" type=\"number\" step=\"'+step+'\" value=\"'+val+'\"><span class=\"ed-unit\">'+unit+'<\/span><\/span><\/div>';\n}\nfunction gv(id){ const el=document.getElementById(id); return el?el.value.trim():''; }\nfunction openEdit(n){\n  curNode=n; const hk=n.hk; const noAuto=(!hk && n.px_a==null);   // 无本地行情的非港股(如ETF)→手录价\n  panel.innerHTML='<span class=\"close\" onclick=\"panel.classList.remove(\\'open\\')\">✕<\/span>'+\n    '<h3>'+n.name+' <span class=\"code\">'+n.code+'<\/span><\/h3>'+\n    '<div class=\"kindt\">编辑持仓 · 改完「应用」即页内重算<\/div>'+\n    '<div class=\"sec\"><div class=\"h\">最新持仓<\/div>'+\n      edRow('股数','ed-shares',n.shares,'1','股')+\n      edRow('摊薄成本','ed-cost',n.cost,'any',hk?'HK$':'¥')+\n      (hk?(edRow('当日价','ed-pxhkd',(n.px_hkd==null?'':n.px_hkd),'any','HK$')+\n           edRow('港元汇率','ed-rate',(+RATE).toFixed(4),'0.0001','→¥')):'')+\n      (noAuto?edRow('当日价/净值','ed-pxman',(n.px_manual==null?'':n.px_manual),'any','¥'):'')+\n    '<\/div>'+\n    '<div class=\"ed-actions\">'+\n      '<button class=\"ed-btn primary\" onclick=\"saveAndRefresh(this)\">保存并刷新<\/button>'+\n      '<button class=\"ed-btn\" onclick=\"applyEdit()\">仅试算<\/button>'+\n      '<button class=\"ed-btn\" onclick=\"exportJSON()\">复制JSON<\/button>'+\n      '<button class=\"ed-btn\" onclick=\"openCard(curNode)\">取消<\/button>'+\n    '<\/div><div id=\"ed-out\"><\/div>';\n  panel.classList.add('open');\n}\nfunction readInputsInto(n){\n  const s=gv('ed-shares'), c=gv('ed-cost');\n  if(s!=='') n.shares=+s;\n  if(c!=='') n.cost=+c;\n  if(n.hk){ const p=gv('ed-pxhkd'); n.px_hkd=(p===''?null:+p); const rr=gv('ed-rate'); if(rr!=='') RATE=+rr; }\n  if(!n.hk){ const el=document.getElementById('ed-pxman'); if(el){ const pm=el.value.trim(); n.px_manual=(pm===''?null:+pm); } }\n}\nfunction applyEdit(){ readInputsInto(curNode); recomputeAll(); renderSummary(); render(cur); openCard(curNode); }\nfunction buildHoldingsObj(){\n  const mr=JSON.parse(JSON.stringify(DATA.meta_raw));\n  mr.updated=today(); mr.hkd_cny_rate=+(+RATE).toFixed(4); mr.hkd_cny_asof=today();\n  const byCode={}; nodes.forEach(n=>byCode[n.code]=n);\n  const hs=DATA.holdings_raw.map(h=>{ const n=byCode[h.ts_code]; const o=Object.assign({},h);\n    if(n){ o.shares=n.shares; o.cost=n.cost; if(n.hk&&n.px_hkd!=null){ o.px_hkd=n.px_hkd; o.px_asof=today(); } if(!n.hk&&n.px_manual!=null){ o.px_manual=n.px_manual; o.px_asof=today(); } }\n    return o; });\n  return {_meta:mr, holdings:hs};\n}\nfunction edMsg(html,err){ document.getElementById('ed-out').innerHTML='<div style=\"font-size:11px;margin:8px 0;color:'+(err?'#c0392b':'var(--sub)')+'\">'+html+'<\/div>'; }\nasync function saveAndRefresh(btn){\n  readInputsInto(curNode); recomputeAll(); renderSummary(); render(cur);\n  if(location.protocol!=='http:'){ edMsg('无本地服务：改用下方「复制JSON」粘回 holdings.json。',true); return exportJSON(); }\n  const old=btn.textContent; btn.disabled=true; btn.textContent='保存中…';\n  try{\n    const r=await fetch('/api/save-holdings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(buildHoldingsObj())});\n    const j=await r.json();\n    if(j.ok){ btn.textContent='已保存 ✓ 刷新中…'; edMsg((j.msg||'').split('\\n').pop()); setTimeout(()=>location.reload(),600); }\n    else{ btn.disabled=false; btn.textContent=old; edMsg('保存失败：'+(j.msg||''),true); }\n  }catch(e){ btn.disabled=false; btn.textContent=old; edMsg('保存失败：'+e,true); }\n}\nfunction exportJSON(){\n  const txt=JSON.stringify(buildHoldingsObj(), null, 2);\n  window.__exp=txt;\n  document.getElementById('ed-out').innerHTML=\n    '<textarea class=\"ed-export\" readonly>'+txt.replace(/<\/g,'&lt;')+'<\/textarea>'+\n    '<div style=\"display:flex;gap:8px;margin-top:6px;align-items:center\"><button class=\"ed-btn primary\" onclick=\"copyOut(this)\">复制到剪贴板<\/button>'+\n    '<span style=\"font-size:10.5px;color:var(--sub)\">粘回 holdings.json 覆盖，即同步真源<\/span><\/div>';\n}\nfunction copyOut(btn){ navigator.clipboard.writeText(window.__exp||'').then(()=>{btn.textContent='已复制 ✓';setTimeout(()=>btn.textContent='复制到剪贴板',1500);}); }\n\n/* —— 一键刷新：POST 本地服务重跑生成器（仅本地服务模式可用） —— */\nasync function refreshBoard(btn){\n  const note=document.getElementById('refreshNote'); note.className='refresh-note'; note.textContent='';\n  if(location.protocol!=='http:'){\n    note.className='refresh-note err';\n    note.textContent='需用「启动看板.command」打开(本地服务模式)才能一键刷新;当前是直接打开文件。';\n    return;\n  }\n  const old=btn.textContent; btn.disabled=true; btn.textContent='刷新中…';\n  try{\n    const r=await fetch('/api/refresh',{method:'POST'});\n    const j=await r.json();\n    if(j.ok){ btn.textContent='已刷新 ✓'; note.textContent=(j.msg||'').split('\\n').pop(); setTimeout(()=>location.reload(),500); }\n    else{ btn.disabled=false; btn.textContent=old; note.className='refresh-note err'; note.textContent='刷新失败：'+(j.msg||''); }\n  }catch(e){ btn.disabled=false; btn.textContent=old; note.className='refresh-note err'; note.textContent='刷新失败：'+e; }\n}\n\n/* —— 顶部按钮按打开方式自适应：服务模式=刷新；file://=打开所在文件夹 —— */\nfunction openFolder(){\n  const url=location.href.replace(/[?#].*$/,'').replace(/[^\\/]*$/,'');   // 去掉文件名→本文件夹URL\n  const note=document.getElementById('refreshNote');\n  const w=window.open(url,'_blank');\n  if(!w){ note.className='refresh-note err'; note.textContent='浏览器拦了弹窗 · 手动到此文件夹双击「启动看板.command」：'+decodeURIComponent(url.replace(/^file:\\/\\//,'')); }\n  else{ note.className='refresh-note'; note.textContent='已打开文件夹 · 双击「启动看板.command」启动服务后即可一键刷新'; }\n}\nfunction initTopBtn(){\n  const btn=document.getElementById('refreshBtn');\n  if(location.protocol==='http:'){ btn.textContent='⟳ 刷新'; btn.title='重跑生成器并刷新'; btn.onclick=()=>refreshBoard(btn); }\n  else{ btn.textContent='📂 打开文件夹'; btn.title='当前是直接打开文件(无服务)；点此打开所在文件夹，双击「启动看板.command」启动服务后即可一键刷新'; btn.onclick=()=>openFolder(); }\n}\n\n/* —— 现金三账户编辑（存回走本地服务 /api/save-holdings） —— */\nfunction cashAcctBase(){\n  return (meta.cash_accounts && meta.cash_accounts.length) ? meta.cash_accounts\n    : [{name:'太平洋证券',amount:0},{name:'招商证券',amount:0},{name:'招商证券两融',amount:0}];\n}\nfunction edRowCash(name,id,val){\n  return '<div class=\"ed-row\"><label>'+name+'<\/label><span class=\"ed-inp\"><input id=\"'+id+'\" type=\"number\" step=\"0.01\" value=\"'+(val!=null?val:0)+'\"><span class=\"ed-unit\">¥<\/span><\/span><\/div>';\n}\nfunction currentAccts(){ return cashAcctBase().map((a,i)=>({name:a.name, amount:+(gv('cash-'+i)||0)})); }\nfunction updateCashSum(){ const s=currentAccts().reduce((x,a)=>x+(a.amount||0),0); const el=document.getElementById('cash-sum'); if(el) el.textContent=wan(s)+'（¥'+s.toLocaleString(undefined,{maximumFractionDigits:2})+'）'; }\nfunction openCash(){\n  const accts=cashAcctBase();\n  const rows=accts.map((a,i)=>edRowCash(a.name,'cash-'+i,a.amount)).join('');\n  panel.innerHTML='<span class=\"close\" onclick=\"panel.classList.remove(\\'open\\')\">✕<\/span>'+\n    '<h3>现金账户<\/h3>'+\n    '<div class=\"kindt\">三账户额度 · 合计即总现金，「保存」写回 holdings.json<\/div>'+\n    '<div class=\"sec\"><div class=\"h\">账户额度（元）<\/div>'+rows+\n      '<div class=\"kv\" style=\"margin-top:8px\"><span class=\"kk\">合计<\/span><span class=\"vv\" id=\"cash-sum\">…<\/span><\/div><\/div>'+\n    '<div class=\"ed-actions\"><button class=\"ed-btn primary\" onclick=\"saveCash(this)\">保存<\/button>'+\n      '<button class=\"ed-btn\" onclick=\"panel.classList.remove(\\'open\\')\">取消<\/button><\/div><div id=\"ed-out\"><\/div>';\n  panel.classList.add('open');\n  updateCashSum();\n  accts.forEach((a,i)=>{ const el=document.getElementById('cash-'+i); if(el) el.addEventListener('input',updateCashSum); });\n}\nasync function saveCash(btn){\n  const accts=currentAccts();\n  const obj=buildHoldingsObj(); obj._meta.cash_accounts=accts;\n  if(location.protocol!=='http:'){ edMsg('无本地服务：用「启动看板.command」打开后再存，或在 Cowork artifact 里改。',true); return; }\n  const old=btn.textContent; btn.disabled=true; btn.textContent='保存中…';\n  try{\n    const r=await fetch('/api/save-holdings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(obj)});\n    const j=await r.json();\n    if(j.ok){ btn.textContent='已保存 ✓ 刷新中…'; setTimeout(()=>location.reload(),600); }\n    else{ btn.disabled=false; btn.textContent=old; edMsg('保存失败：'+(j.msg||''),true); }\n  }catch(e){ btn.disabled=false; btn.textContent=old; edMsg('保存失败：'+e,true); }\n}\n\ndocument.querySelectorAll('#grp button').forEach(b=>b.addEventListener('click',()=>render(b.dataset.g)));\npanel.addEventListener('click',e=>e.stopPropagation());   // 面板内交互不误触关闭\ndocument.addEventListener('click',()=>panel.classList.remove('open'));\nrecomputeAll(); renderSummary(); render('status'); initTopBtn();\n<\/script>\n<\/body>\n<\/html>";
let _holdLoaded=false;
function mountHold(){

  if(!f) return;
  if(!HOLDINGS_HTML){ f.removeAttribute('srcdoc'); _holdLoaded=true; return; }
  f.srcdoc=HOLDINGS_HTML; _holdLoaded=true;
}
function switchTab(t){
  document.body.dataset.tab=t;   // 供标签栏文字随页面配色（body[data-tab=hold] 换深字）
  document.querySelectorAll('.tabs .tab-btn').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
  document.getElementById('page-lib').classList.toggle('off',t!=='lib');
  document.getElementById('page-hold').classList.toggle('off',t!=='hold');
  if(t==='hold') mountHold();
}
document.querySelectorAll('.tabs .tab-btn').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.tab)));

function sectorOf(ind){
  const s=ind||'';
  if(/半导体|射频|微波|LED|化合物|集成电路/.test(s)) return '半导体';
  if(/光通信|光器件|微纳光学|3D视觉|光学/.test(s)) return '光通信/光电';
  if(/PCB|覆铜板|CCL|电子材料|矿物制品/.test(s)) return '电子材料/PCB';
  if(/元器件|天线|传动|连接器/.test(s)) return '元器件';
  if(/通信|导航|空天信息/.test(s)) return '通信';
  if(/航天|军工/.test(s)) return '航天军工';
  if(/机械|电镀设备|化工机械/.test(s)) return '机械设备';
  if(/小金属|稀土|铜|黄金|石油|有色|化工原料/.test(s)) return '资源/材料';
  if(/光伏|新能源|储能/.test(s)) return '新能源';
  return '其他';
}

const FLAG={high:{g:'!',c:'#F2726B',t:'回避 · 需规避（<50）'},finrisk:{g:'?',c:'#E8A24C',t:'财务维不健康（≤2.5/5）'}};

const RATING_ORDER=['强烈关注','可配置','观察','谨慎','回避'];

DATA.forEach(d=>{ if(!d.sector) d.sector=sectorOf(d.industry); if(!d._q) d._q=(d.name+' '+d.ts+' '+d.industry+' '+d.track).toLowerCase(); });

const board=document.getElementById('board'), panel=document.getElementById('panel'), scrim=document.getElementById('scrim');
const nCG=DATA.filter(d=>CHANGGENG.has(d.ts)).length, nHold=DATA.filter(d=>d.hold).length, nAlloc=DATA.filter(d=>d.rating==='可配置'||d.rating==='强烈关注').length;
document.getElementById('sub').innerHTML='六维打分（政策5 / 技术供需35 / 竞争25 / 新赛道15 / 估值15 / 财务5）· 引擎实跑财务维 · reviewer research-CC · <b>非投资建议</b>。刻度：可配置≥75 / 观察65–74 / 谨慎50–64 / 回避&lt;50。双轴：<b>色</b>=行业组（光通信/PCB/先进封装/半导体设备/半导体材料/存储/半导体设计与制备/温控散热/商业航天/机器人/资源/油气化工/新能源/其他），卡片标签=<b>环节</b>。默认只显<b>常更标的</b>，按上方按键展开按需标的。';
document.getElementById('kpi').innerHTML=[
  ['n',DATA.length,'标的星点'],['n',nCG,'常更标的'],['n hl',nHold,'在库持仓'],['n',nAlloc,'可配置档']
].map(k=>'<div class="col"><div class="'+k[0]+'">'+k[1]+'</div><div class="l">'+k[2]+'</div></div>').join('');

const secCounts={}; DATA.forEach(d=>secCounts[d.sector]=(secCounts[d.sector]||0)+1);
document.getElementById('lg-sec').innerHTML='<span class="lh">行业（点击筛选）</span>'+Object.keys(SECTORS).filter(s=>secCounts[s]).map(s=>

document.querySelectorAll('#lg-sec .li').forEach(el=>el.addEventListener('click',()=>{

function groupsOf(list){
  const g={};
  if(grp==='rating'){ RATING_ORDER.forEach(r=>g[r]=[]); list.forEach(d=>{(g[d.rating]=g[d.rating]||[]).push(d);});
    return RATING_ORDER.filter(r=>g[r]&&g[r].length).map(r=>({en:REN[r]||r,cn:'评级 · '+r,color:RCOL[r]||'#888',items:g[r]})); }
  if(grp==='sector'){ list.forEach(d=>{(g[d.sector]=g[d.sector]||[]).push(d);});
    return Object.keys(SECTORS).filter(s=>g[s]).map(s=>({en:SEC_EN[s]||s,cn:'行业 · '+s,color:SECTORS[s],items:g[s]})); }
  list.forEach(d=>{const t=d.track||'（未分赛道）'; (g[t]=g[t]||[]).push(d);});
  return Object.keys(g).sort((a,b)=>g[b].length-g[a].length).map(t=>({en:'Track',cn:'赛道 · '+t,color:'#B39DFF',items:g[t]}));
}
function card(d){
  let risk=RISK[d.rating]||'low'; const sc=SECTORS[d.sector];
  const finS=d.six&&d.six['财务健康与风险(5)'];
  if(risk==='low' && typeof finS==='number' && finS<=FIN_MAX) risk='finrisk';
  const w=document.createElement('div'); w.className='cardw';
  const c=document.createElement('div'); c.className='card';
  c.style.setProperty('--sc',sc); c.style.setProperty('--rcol',RCOL[d.rating]||'#888');
  c.innerHTML='<div class="neb"></div><div class="stars"></div><div class="cc">'+
    '<div class="top"><span class="nm">'+d.name+(d.hold?'<span class="hd" title="持仓"></span>':'')+'</span><span class="sc">'+(d.total??'—')+'</span></div>'+
    '<div class="code">'+d.ts+'</div>'+
    '<div class="r2"><span class="indtag">'+(d.seg||d.sector)+'</span><span class="rbadge">'+d.rating+'</span></div></div>';
  c.addEventListener('click',e=>{e.stopPropagation(); openCard(d);});
  w.appendChild(c);
  var badges=[];
  const fl=FLAG[risk];
  if(fl) badges.push('<div class="flag" style="--fc:'+fl.c+'" title="'+fl.t+'"><span class="g">'+fl.g+'</span></div>');
  if(typeof d.ret20==='number' && d.ret20!==0){ var up=d.ret20>0, ac=up?'#F2726B':'#76E0A8', tri=up?'<path d="M5 2 L9 8 L1 8 Z"/>':'<path d="M5 8 L1 2 L9 2 Z"/>', at=(up?'20交易日收益为正 +':'20交易日收益为负 ')+(d.ret20*100).toFixed(1)+'%';
    badges.push('<div class="flag arw" style="--fc:'+ac+'" title="'+at+'"><svg class="tri" viewBox="0 0 10 10">'+tri+'</svg></div>'); }
  if(badges.length){ const bs=document.createElement('div'); bs.className='flags'; bs.innerHTML=badges.join(''); w.appendChild(bs); }
  return w;
}
function render(){
  let list=DATA.filter(d=>!secOff.has(d.sector) && (!query||d._q.includes(query)) && (showOndemand||CHANGGENG.has(d.ts)));
  board.innerHTML=''; const groups=groupsOf(list);
  document.getElementById('hint').textContent='显示 '+list.length+' / '+DATA.length+' 只';
  if(!list.length){ board.innerHTML='<div class="empty">没有匹配的标的</div>'; return; }
  groups.forEach(gr=>{
    const sec=document.createElement('div'); sec.className='row';
    const lab=document.createElement('div'); lab.className='row-label';
    lab.innerHTML='<span class="bar-i" style="--rc:'+gr.color+'"></span><span class="en">'+gr.en+'</span><span class="cn">'+gr.cn+'</span><span class="cnt">'+gr.items.length+'</span>';
    sec.appendChild(lab);
    const cs=document.createElement('div'); cs.className='cards';
    gr.items.sort((a,b)=>(b.total||0)-(a.total||0)).forEach(d=>cs.appendChild(card(d)));
    sec.appendChild(cs); board.appendChild(sec);
  });
}
const DIMMAX={'政策与监管(5)':5,'技术变革与供需(35)':35,'竞争格局与产业链(25)':25,'新赛道与未来预期(15)':15,'估值与安全边际(15)':15,'财务健康与风险(5)':5};
const DIMSUB={
 '政策与监管(5)':[['海外风险',3],['国内政策',1],['准入',1]],
 '技术变革与供需(35)':[['技术端',12],['供需端',23]],
 '竞争格局与产业链(25)':[['市占率',5],['竞争壁垒',5],['产业链地位',5],['上下游议价',5],['客户粘性',3],['国产替代',2]],
 '新赛道与未来预期(15)':[['布局投入',5],['技术落地',5],['预期差催化',5]],
 '估值与安全边际(15)':[['相对估值',5],['增长匹配',3],['绝对估值',4],['下行安全',2],['市场情绪',1]],
 '财务健康与风险(5)':[['盈利',1],['运营',1],['资产质量',1],['财务健康',1],['现金流',1]]
};
const SUBC=['#7CC4EE','#76E0A8','#E8A24C','#B39DFF','#D97A26','#A8D96A'];
const FACTKEY={pe_ttm:'PE(TTM)',pb:'PB',ps_ttm:'PS(TTM)',roe_avg:'ROE均值%',gm:'毛利率%',debt_ratio:'负债率%',np_yoy:'净利YoY%',rev_yoy:'营收YoY%',fin_score:'财务维',total_mv_bn:'市值(亿)',pe_pct_3y:'PE三年分位%',rd_rate:'研发费率%'};
function fmtd(s){s=''+s;return s.length>=8?s.slice(4,6)+'-'+s.slice(6,8):s;}
function klineSVG(K){var W=434,padL=42,padT=10,ph=112,gap=14,vh=34,n=K.length,x0=padL,plotW=W-padL,vBase=padT+ph+gap+vh,H=vBase+16;
  var lo=Math.min.apply(null,K.map(function(k){return k[3];})),hi=Math.max.apply(null,K.map(function(k){return k[2];}));
  var vmax=Math.max.apply(null,K.map(function(k){return k[5];}))||1,pad=(hi-lo)*0.05||1;lo-=pad;hi+=pad;
  var base=K[0][4]||K[0][1]||1;
  var slot=plotW/n,bw=Math.max(2,slot*0.6);function yP(v){return padT+ph*(1-(v-lo)/(hi-lo));}
  function cX(i){return x0+i*slot+slot/2;}
  function fp(v){var x=(v/base-1)*100;return (x>=0?'+':'')+x.toFixed(1)+'%';}
  var s='<line x1="'+x0+'" x2="'+x0+'" y1="'+padT+'" y2="'+(padT+ph).toFixed(1)+'" stroke="rgba(255,255,255,.14)"/>';
  for(var g=0;g<=3;g++){var pv=lo+(hi-lo)*g/3,yy=yP(pv);
    s+='<line x1="'+x0+'" x2="'+W+'" y1="'+yy.toFixed(1)+'" y2="'+yy.toFixed(1)+'" stroke="rgba(255,255,255,.055)"/>';
    s+='<text x="'+(x0-4)+'" y="'+(yy+3).toFixed(1)+'" fill="#9aa4b8" font-size="9" text-anchor="end">'+fp(pv)+'</text>';}
  var y0=yP(base);
  s+='<line x1="'+x0+'" x2="'+W+'" y1="'+y0.toFixed(1)+'" y2="'+y0.toFixed(1)+'" stroke="rgba(255,255,255,.34)" stroke-dasharray="3 3"/>';
  s+='<line x1="'+x0+'" x2="'+W+'" y1="'+vBase+'" y2="'+vBase+'" stroke="rgba(255,255,255,.12)"/>';
  s+='<text x="'+(x0-4)+'" y="'+(padT+ph+gap+8)+'" fill="#7A8294" font-size="8.5" text-anchor="end">量</text>';
  for(var i=0;i<n;i++){var k=K[i],o=k[1],h=k[2],l=k[3],c=k[4],vol=k[5];
    var col=c>=o?'#F2726B':'#76E0A8',cx=cX(i),yo=yP(o),yc=yP(c),top=Math.min(yo,yc),bh=Math.max(1,Math.abs(yo-yc)),vhh=Math.max(1,vh*vol/vmax);
    s+='<line x1="'+cx.toFixed(1)+'" x2="'+cx.toFixed(1)+'" y1="'+yP(h).toFixed(1)+'" y2="'+yP(l).toFixed(1)+'" stroke="'+col+'" stroke-width="1"/>';
    s+='<rect x="'+(cx-bw/2).toFixed(1)+'" y="'+top.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+bh.toFixed(1)+'" fill="'+col+'"/>';
    s+='<rect x="'+(cx-bw/2).toFixed(1)+'" y="'+(vBase-vhh).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+vhh.toFixed(1)+'" fill="'+col+'" opacity=".55"/>';}
  var step=Math.max(1,Math.floor((n-1)/4));
  for(var j=0;j<n;j+=step){var cx2=cX(j);
    s+='<line x1="'+cx2.toFixed(1)+'" x2="'+cx2.toFixed(1)+'" y1="'+vBase+'" y2="'+(vBase+3)+'" stroke="rgba(255,255,255,.2)"/>';
    s+='<text x="'+cx2.toFixed(1)+'" y="'+(H-3)+'" fill="#8f98a8" font-size="8.5" text-anchor="middle">'+fmtd(K[j][0])+'</text>';}
  return '<svg class="kline" viewBox="0 0 '+W+' '+H+'">'+s+'</svg>';}
function openCard(d){
  const sc=SECTORS[d.sector];
  const dims=Object.keys(DIMMAX).map(k=>{
    const v=(d.six&&d.six[k]!=null)?d.six[k]:0, mx=DIMMAX[k], pct=Math.round(v/mx*100), nm=k.replace(/\(\d+\)/,'');
    return '<div class="dim"><div class="dl"><span>'+nm+'</span><b>'+v+' / '+mx+'</b></div>'+
      '<div class="track-w"><div class="track-f" style="width:'+pct+'%"></div></div>'+
      '<div class="subbars">'+((d.sub&&d.sub[k])||[]).map((p,i)=>{var it=p[0],v=p[1],mx=p[2]||1,pct=Math.max(3,Math.round(v/mx*100));return '<div class="sbcol" style="flex:'+mx+'" title="'+it+' · 实际 '+v+' / 满分 '+mx+'"><div class="sbbar"><i style="width:'+pct+'%;--c:'+SUBC[i%SUBC.length]+'"></i></div><div class="sbmeta"><b>'+v+'</b>/'+mx+' '+it+'</div></div>';}).join('')+'</div>'+
      '<div class="subcap">'+((d.sub&&d.sub[k])?'二级实际得分 · 填充＝得分/满分、数字＝'+(d.sub_scorer||'')+' 实际分/满分':'该腿无子项分（仅维度总分）')+'</div></div>';
  }).join('');
  const facts=Object.keys(FACTKEY).filter(k=>d.facts&&d.facts[k]!=null&&d.facts[k]!==''&&d.facts[k]!=='—').map(k=>{
    let val=d.facts[k]; if(typeof val==='number'&&!Number.isInteger(val)) val=Math.round(val*100)/100;
    return '<div><span class="fk">'+FACTKEY[k]+'</span><span class="fv">'+val+'</span></div>';
  }).join('');
  const finS=d.six&&d.six['财务健康与风险(5)'];
  const finWarn=(typeof finS==='number'&&finS<=FIN_MAX)?' <span class="warn">⚠ 财务维不健康 '+finS+'/5</span>':'';
  const hist=(d.hist&&d.hist.length>0)?'<div class="h"><span>Track</span><span class="cn">评分轨迹</span></div><div class="hist">'+d.hist.slice(-1).map(h=>'<span>'+h[0]+' · '+(h[1]??'—')+(h[2]?' <span class="sk">'+h[2]+'</span>':'')+'</span>').join('')+'</div>':'';
  const kl=(d.kline&&d.kline.length)?'<div class="h"><span>Price</span><span class="cn">近20交易日 K线（含成交量）</span></div>'+klineSVG(d.kline)+'<div class="subcap">红涨绿跌 · 纵轴＝相对首日收盘 %（0% 虚线）· 上K线 / 下成交量 · Market-Data 日线</div>':'';
  panel.style.setProperty('--sc',sc); panel.style.setProperty('--rcol',RCOL[d.rating]||'#D6DEE8');
  panel.innerHTML='<span class="close" onclick="closeP()">✕</span>'+
    '<h3>'+(d.hold?'<span class="cc"><span class="hd" style="display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--moon);margin-right:7px;box-shadow:0 0 6px var(--moon)"></span></span>':'')+d.name+'</h3>'+
    '<div class="pcode">'+d.ts+' · 分析日 '+(d.date||'')+(d.scorer?' · '+d.scorer:'')+(d.hold&&d.since?' · 持仓（'+d.since+'建仓）':'')+'</div>'+
    '<div class="ptags"><span class="indtag" style="--sc:'+sc+'">'+(d.seglabel||d.sector)+'</span>'+
    (d.track?'<span class="indtag" style="--sc:#B39DFF">'+d.track+'</span>':'')+'</div>'+
    '<div class="pscore"><span class="big" style="--rcol:'+(RCOL[d.rating]||'#D6DEE8')+';color:'+(RCOL[d.rating]||'#D6DEE8')+'">'+(d.total??'—')+'</span><span class="of">/ 100 · '+d.rating+'</span></div>'+
    '<div class="h"><span>Six Forces</span><span class="cn">六维拆解</span></div>'+dims+
    (facts?'<div class="h"><span>Engine</span><span class="cn">引擎实测（财务/估值）</span>'+finWarn+'</div><div class="facts">'+facts+'</div>':'')+
    '<div class="h"><span>Thesis</span><span class="cn">一句话判断</span></div><div class="thesis">'+(d.thesis||'—')+'</div>'+hist+kl;
  panel.classList.add('open'); scrim.classList.add('open');
}
function closeP(){ panel.classList.remove('open'); scrim.classList.remove('open'); }
scrim.addEventListener('click',closeP);
