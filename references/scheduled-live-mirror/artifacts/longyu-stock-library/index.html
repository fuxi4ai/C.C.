<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>龙鱼五力 · 个股库看板</title>
<style>
/* ===== 星河·暗 · 冻结规范 REF-001 ===== */
:root{ color-scheme:dark;
  --bg:#000000;                        /* 真黑底 · 让辉光成唯一光源 */
  --card:rgba(15,18,25,.85);           /* 卡片底 · 深石板蓝 + blur */
  --card2:rgba(19,23,31,.92);          /* 侧栏底 */
  --edge:rgba(255,255,255,.08);        /* 卡片边 · 几乎隐形 */
  --tx:#E8ECF2; --sub:#7A8294; --faint:#3A3F4A; --hover:rgba(255,255,255,.045);
  --moon:#D6DEE8; --blue:#4FC3F7; --grn:#76E0A8; --amber:#FFC857; --mag:#E879C8;
  --focus:#FF8A4C; --cta:#8B7CF8; --warn:#F2726B;
  --sans:"Times New Roman","Times","Source Han Serif SC","Noto Serif SC","思源宋体","Songti SC","STSong",serif;
  --en:"Times New Roman","Times",serif;
  --mono:"JetBrains Mono","SF Mono","Fira Code",ui-monospace,monospace;
  --r-sm:6px; --r-md:10px; --r-max:12px;
  --ease:600ms cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:14px;line-height:1.6;
  min-height:100vh;position:relative;overflow-x:hidden;letter-spacing:.1px}
/* 极淡星云(非 linear-gradient 背景，是星系尘埃) + 全站暗星银河 */
body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;background:
  radial-gradient(46vw 40vh at 8% -6%, rgba(79,195,247,.10), transparent 60%),
  radial-gradient(42vw 38vh at 96% 2%, rgba(255,200,87,.06), transparent 58%),
  radial-gradient(44vw 42vh at 74% 114%, rgba(118,224,168,.07), transparent 60%),
  radial-gradient(38vw 36vh at 42% 52%, rgba(232,121,200,.05), transparent 62%)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.55;background-image:
  radial-gradient(1.4px 1.4px at 12% 18%,rgba(214,222,232,.9),transparent),
  radial-gradient(1px 1px at 68% 12%,rgba(214,222,232,.6),transparent),
  radial-gradient(1px 1px at 34% 62%,rgba(214,222,232,.7),transparent),
  radial-gradient(1.4px 1.4px at 82% 44%,rgba(214,222,232,.55),transparent),
  radial-gradient(1px 1px at 52% 82%,rgba(214,222,232,.65),transparent),
  radial-gradient(1px 1px at 90% 76%,rgba(214,222,232,.5),transparent),
  radial-gradient(1.6px 1.6px at 22% 90%,rgba(214,222,232,.8),transparent),
  radial-gradient(1px 1px at 6% 50%,rgba(214,222,232,.5),transparent),
  radial-gradient(1px 1px at 60% 36%,rgba(214,222,232,.5),transparent);
  animation:skyTwinkle 6.5s ease-in-out infinite alternate}
@keyframes skyTwinkle{from{opacity:.38}to{opacity:.62}}
.num{font-family:var(--en);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.sc-en{font-family:var(--en);text-transform:uppercase;letter-spacing:.18em;font-weight:500}
.wrap{max-width:1240px;margin:0 auto;padding:44px 26px 90px;position:relative}
/* ===== 页眉 ===== */
header{border-bottom:1px solid var(--edge);padding-bottom:22px;margin-bottom:26px}
.logo{display:flex;align-items:center;gap:15px}
.logo .star{width:13px;height:13px;border-radius:50%;background:var(--blue);flex:none;
  box-shadow:0 0 6px rgba(79,195,247,1),0 0 16px rgba(79,195,247,.6),0 0 34px rgba(79,195,247,.3),0 0 60px rgba(79,195,247,.12);
  animation:twinkle 3.6s ease-in-out infinite}
.logo h1{font-size:25px;font-weight:600;letter-spacing:.5px;color:#fff}
.logo .en{font-size:10.5px;color:var(--sub);margin-top:3px}
.sub{color:var(--sub);font-size:12.5px;margin:14px 0 0;line-height:1.7;max-width:920px}
.sub b{color:var(--tx);font-weight:600}
/* KPI 条 · 4 列等宽无分隔 · 无箭头 */
.kpi{display:grid;grid-template-columns:repeat(4,auto);gap:38px;margin-top:20px}
.kpi .col .n{font-family:var(--en);font-size:27px;font-weight:600;letter-spacing:-.01em;line-height:1}
.kpi .col .l{font-size:11px;color:var(--sub);letter-spacing:.04em;margin-top:5px}
.kpi .col.hl .n{color:var(--cta)}
/* ===== 控制条 ===== */
.bar{display:flex;gap:11px 13px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.seg{display:inline-flex;background:rgba(255,255,255,.035);border:1px solid var(--edge);border-radius:var(--r-max);overflow:hidden}
.seg button{font:inherit;font-size:12px;color:var(--sub);background:transparent;border:0;padding:8px 15px;cursor:pointer;transition:color var(--ease),background var(--ease)}
.seg button:hover{color:var(--tx)}
.seg button.on{background:var(--cta);color:#0b0a16;font-weight:600}
.search{font:inherit;font-size:12.5px;height:38px;padding:0 14px;border:1px solid var(--edge);border-radius:var(--r-max);background:rgba(255,255,255,.03);color:var(--tx);width:200px;outline:none;transition:border-color var(--ease),background var(--ease)}
.search::placeholder{color:var(--faint)}
.search:focus{border-color:var(--cta);background:rgba(139,124,248,.08)}
.odbtn{font:inherit;font-size:12.5px;height:38px;padding:0 15px;border:1px solid var(--edge);border-radius:var(--r-max);background:transparent;color:var(--sub);cursor:pointer;transition:all var(--ease)}
.odbtn:hover{color:var(--tx);border-color:rgba(255,255,255,.16)}
.odbtn.on{color:#0b0a16;background:var(--cta);border-color:transparent;font-weight:600}
.hint{font-size:11px;color:var(--faint);letter-spacing:.03em}
/* ===== 图例 ===== */
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-bottom:10px;font-size:11px;color:var(--sub)}
.legend .lh{color:var(--tx);font-weight:600;margin-right:3px;font-size:11px}
.legend .li{display:flex;align-items:center;gap:6px;cursor:pointer;padding:3px 8px;border-radius:var(--r-sm);transition:background var(--ease),opacity var(--ease)}
.legend .li:hover{background:var(--hover)}
.legend .li.off{opacity:.3}
.kc{width:8px;height:8px;border-radius:50%;display:inline-block}
.gw{width:11px;height:11px;border-radius:50%;display:inline-block;background:#0c0f15;border:1px solid var(--edge)}
.legend .cap{color:var(--faint)}
/* ===== 分组行 ===== */
.board{margin-top:8px}
.row{margin-bottom:30px}
.row-label{display:flex;align-items:center;gap:9px;margin:0 0 13px}
.row-label .bar-i{width:3px;height:13px;border-radius:2px;background:var(--rc,var(--blue));
  box-shadow:0 0 8px -1px var(--rc,var(--blue))}
.row-label .en{font-family:var(--en);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--sub)}
.row-label .cn{font-size:14px;font-weight:600;color:var(--tx)}
.row-label .cnt{font-family:var(--en);font-size:11.5px;color:var(--faint);margin-left:2px}
.cards{display:flex;flex-wrap:wrap;gap:15px}
.cardw{position:relative;width:205px}
/* ===== 卡片 · 玻璃石板 ===== */
/* GAI 项目卡·深色版：宣纸玻璃卡承为深色玻璃 · 18px 圆角 · 顶部白光 sheen 高光条 */
.card{position:relative;width:100%;padding:15px 16px 14px;cursor:pointer;overflow:hidden;
  background:linear-gradient(150deg, rgba(26,31,41,.92), rgba(16,20,27,.95) 46%, rgba(22,27,37,.92));
  border:1px solid var(--edge);border-radius:18px;
  box-shadow:0 6px 22px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.05);
  transition:transform var(--ease),box-shadow var(--ease),border-color var(--ease)}
.card::after{content:"";position:absolute;left:0;right:0;top:0;height:34%;border-radius:18px 18px 0 0;
  background:linear-gradient(180deg,rgba(255,255,255,.12),transparent 90%);pointer-events:none;z-index:2}
.card:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--sc) 45%,var(--edge));
  box-shadow:0 14px 32px rgba(0,0,0,.62), inset 0 0 0 1px rgba(255,255,255,.08),
    0 0 20px -4px color-mix(in srgb,var(--sc) 65%,transparent)}
/* ===== 悬浮标记 · 代替"问题标的外发光"（星河·暗不宜用外发光编码状态） ===== */
.flags{position:absolute;top:-10px;left:-10px;z-index:5;display:flex;align-items:center;gap:4px}
.flag{flex:none;width:23px;height:23px;border-radius:50%;pointer-events:none;
  display:flex;align-items:center;justify-content:center;
  background:rgba(12,15,21,.96);
  border:1px solid color-mix(in srgb,var(--fc) 55%,var(--edge));
  box-shadow:0 5px 13px rgba(0,0,0,.6), 0 0 9px -2px color-mix(in srgb,var(--fc) 55%,transparent);
  animation:floatBob 3.8s ease-in-out infinite}
.flag .g{display:block;font-family:var(--en);font-weight:600;font-size:15px;line-height:1;color:var(--fc);
  transform:rotate(12deg) translateY(-.5px)}
.flag.arw .g{transform:none;font-weight:700}
.flag .tri{width:11px;height:11px;display:block;fill:var(--fc)}
.flag-lg .tri{width:8px;height:8px;display:block;fill:var(--fc)}
@keyframes floatBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){.flag{animation:none}}
/* 图例内的小样标 */
.flag-lg{width:16px;height:16px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  background:rgba(12,15,21,.9);border:1px solid color-mix(in srgb,var(--fc) 55%,var(--edge));
  box-shadow:0 2px 6px rgba(0,0,0,.5),0 0 6px -2px color-mix(in srgb,var(--fc) 55%,transparent)}
.flag-lg .g{font-family:var(--en);font-weight:600;font-size:10.5px;line-height:1;color:var(--fc);transform:rotate(12deg)}
.flag-lg.arw .g{transform:none}
/* 卡内星云 = 主视觉（GAI 行业卡范式）：环节色 3 blob 从左上斜铺、blur 柔化为浓云；星点仅少量点缀（去零散碎星） */
.neb{position:absolute;inset:0;z-index:0;filter:blur(11px);opacity:.85;pointer-events:none;
  background:
   radial-gradient(52% 60% at 12% 4%, color-mix(in srgb,var(--sc) 60%,transparent), transparent 66%),
   radial-gradient(56% 66% at 38% 26%, color-mix(in srgb,var(--sc) 34%,transparent), transparent 70%),
   radial-gradient(72% 82% at 66% 52%, color-mix(in srgb,var(--sc) 18%,transparent), transparent 78%)}
.stars{display:none}
@keyframes nebDrift{from{transform:translate(-2%,-1%) scale(1)}to{transform:translate(2%,2%) scale(1.06)}}
@keyframes twinkle{0%{opacity:.55}100%{opacity:.95}}
.cc{position:relative;z-index:3}
.cc .top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.cc .nm{font-size:15px;font-weight:600;letter-spacing:.3px;color:#fff;line-height:1.3}
.cc .hd{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--moon);margin-left:6px;vertical-align:middle;
  box-shadow:0 0 4px rgba(214,222,232,1),0 0 10px rgba(214,222,232,.5)}
.cc .sc{font-family:var(--en);font-size:25px;font-weight:600;line-height:.9;color:var(--rcol);letter-spacing:-.02em;
  text-shadow:0 0 12px color-mix(in srgb,var(--rcol) 55%,transparent)}
.cc .code{font-family:var(--en);font-size:10px;color:var(--faint);margin-top:3px;letter-spacing:.02em}
.cc .r2{display:flex;align-items:center;gap:6px;margin-top:11px;flex-wrap:wrap}
.indtag{font-size:10px;padding:2px 9px 2px 7px;border-radius:99px;display:inline-flex;align-items:center;gap:5px;font-weight:600;
  color:color-mix(in srgb,var(--sc) 74%,#fff);background:color-mix(in srgb,var(--sc) 13%,transparent);
  border:1px solid color-mix(in srgb,var(--sc) 30%,transparent)}
.indtag::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--sc);flex:none;
  box-shadow:0 0 5px color-mix(in srgb,var(--sc) 90%,transparent)}
.rbadge{font-size:10px;font-weight:600;padding:2px 9px;border-radius:99px;margin-left:auto;
  color:var(--rcol);background:color-mix(in srgb,var(--rcol) 15%,transparent);border:1px solid color-mix(in srgb,var(--rcol) 32%,transparent)}
.empty{color:var(--faint);font-size:13px;padding:40px 0;text-align:center}
/* ===== 侧栏 ===== */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);z-index:29;display:none;opacity:0;transition:opacity var(--ease)}
.scrim.open{display:block;opacity:1}
.panel{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%);width:472px;max-width:94vw;max-height:88vh;overflow:auto;z-index:30;display:none;
  background:var(--card2);border:1px solid var(--edge);border-radius:18px;padding:26px 26px 30px;
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  box-shadow:0 30px 90px rgba(0,0,0,.72);transition:transform var(--ease),opacity var(--ease);opacity:0}
.panel.open{display:block;transform:translate(-50%,-50%);opacity:1}
.panel .close{position:absolute;right:20px;top:18px;cursor:pointer;color:var(--sub);font-size:18px;line-height:1;transition:color var(--ease)}
.panel .close:hover{color:var(--tx)}
.panel h3{font-size:20px;font-weight:600;letter-spacing:.4px;color:#fff}
.panel .pcode{font-family:var(--en);font-size:11px;color:var(--sub);margin:5px 0 2px;letter-spacing:.01em}
.panel .ptags{display:flex;gap:6px;flex-wrap:wrap;margin:11px 0 4px}
.panel .pscore{display:flex;align-items:baseline;gap:11px;margin:16px 0 4px}
.panel .pscore .big{font-family:var(--en);font-size:40px;font-weight:600;line-height:1;letter-spacing:-.02em;
  text-shadow:0 0 18px color-mix(in srgb,var(--rcol) 50%,transparent)}
.panel .pscore .of{font-size:13px;color:var(--sub)}
.h{font-family:var(--en);font-size:10.5px;color:var(--blue);font-weight:500;margin:20px 0 10px;letter-spacing:.16em;text-transform:uppercase;border-bottom:1px solid var(--edge);padding-bottom:6px;display:flex;align-items:center;gap:8px}
.h .cn{font-family:var(--sans);letter-spacing:0;text-transform:none;color:var(--tx);font-size:12.5px;font-weight:600}
.dim{margin-bottom:11px}
.dim .dl{display:flex;justify-content:space-between;font-size:11.5px;color:#c3c8d2;margin-bottom:4px}
.dim .dl b{font-family:var(--en);color:var(--tx);font-weight:600}
.track-w{height:7px;border-radius:99px;background:rgba(255,255,255,.06);overflow:hidden}
.track-f{height:100%;border-radius:99px;background:var(--cta);box-shadow:0 0 8px -1px color-mix(in srgb,var(--cta) 80%,transparent)}
.subbars{display:flex;gap:5px;margin-top:7px;align-items:flex-end}
.sbcol{min-width:0;display:flex;flex-direction:column;gap:4px}
.sbbar{height:7px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.sbbar>i{display:block;height:100%;border-radius:99px;background:var(--c);box-shadow:0 0 6px -1px color-mix(in srgb,var(--c) 75%,transparent)}
.sbmeta{font-size:9px;color:var(--faint);text-align:center;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbmeta b{font-family:var(--en);color:var(--sub);font-weight:600;font-size:10px}
.subcap{font-size:9.5px;color:var(--faint);margin-top:5px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:7px 14px;font-size:11.5px}
.facts .fk{color:var(--sub)} .facts .fv{font-family:var(--en);color:var(--tx);font-weight:600;float:right}
.thesis{font-size:12.5px;line-height:1.7;color:#c8cdd6;background:rgba(255,255,255,.03);border:1px solid var(--edge);border-radius:var(--r-md);padding:12px 14px}
.kline{width:100%;height:auto;display:block;margin-top:8px}
.hist{font-size:11px;color:var(--sub);margin-top:8px;display:flex;flex-wrap:wrap;gap:5px}
.hist span{display:inline-block;background:rgba(255,255,255,.04);border:1px solid var(--edge);border-radius:var(--r-sm);padding:3px 8px;font-family:var(--en);font-size:10.5px}
.hist span .sk{color:var(--faint)}
.warn{color:var(--amber);font-weight:600}
</style></head>
<body>
<div class="wrap">
  <header>
    <div class="logo">
      <span class="star"></span>
      <div><h1>龙鱼五力 · 个股库看板</h1><div class="en sc-en">Longyu Five-Forces · Equity Library</div></div>
    </div>
    <div class="sub" id="sub"></div>
    <div class="kpi" id="kpi"></div>
  </header>
  <div class="bar">
    <div class="seg" id="grp">
      <button data-g="rating" class="on">按评级</button>
      <button data-g="sector">按行业</button>
      <button data-g="track">按赛道</button>
    </div>
    <input class="search" id="q" placeholder="搜公司 / 代码 / 赛道…">
    <button class="odbtn" id="odbtn">＋ 显示按需更新标的</button>

  </div>
  <div class="legend" id="lg-sec"></div>
  <div class="legend">
    <span class="lh">状态 · 悬浮标记</span>
    <span class="li"><span class="flag-lg" style="--fc:#F2726B"><span class="g">!</span></span>回避 · 红色叹号（&lt;50 · 需规避）</span>
    <span class="li"><span class="flag-lg" style="--fc:#FFC857"><span class="g">?</span></span>财务维不健康 · 金色问号（财务≤2.5/5）</span>
    <span class="li"><span class="flag-lg arw" style="--fc:#F2726B"><svg class="tri" viewBox="0 0 10 10"><path d="M5 2 L9 8 L1 8 Z"/></svg></span>20交易日收益为正 · 红▲</span>
    <span class="li"><span class="flag-lg arw" style="--fc:#76E0A8"><svg class="tri" viewBox="0 0 10 10"><path d="M5 8 L1 2 L9 2 Z"/></svg></span>20交易日收益为负 · 绿▼</span>
    <span class="cap">其余标的无标记，评级见卡片右上角徽章；色＝行业、卡片标签＝环节；名称后发光小圆点＝持仓。金色问号仅出现于观察/谨慎档</span>
  </div>
  <div class="board" id="board"></div>
</div>

  for(var i=0;i<n;i++){var k=K[i],o=k[1],h=k[2],l=k[3],c=k[4],vol=k[5];
    var col=c>=o?'#F2726B':'#76E0A8',cx=cX(i),yo=yP(o),yc=yP(c),top=Math.min(yo,yc),bh=Math.max(1,Math.abs(yo-yc)),vhh=Math.max(1,vh*vol/vmax);
    s+='<line x1="'+cx.toFixed(1)+'" x2="'+cx.toFixed(1)+'" y1="'+yP(h).toFixed(1)+'" y2="'+yP(l).toFixed(1)+'" stroke="'+col+'" stroke-width="1"/>';
    s+='<rect x="'+(cx-bw/2).toFixed(1)+'" y="'+top.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+bh.toFixed(1)+'" fill="'+col+'"/>';
    s+='<rect x="'+(cx-bw/2).toFixed(1)+'" y="'+(vBase-vhh).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+vhh.toFixed(1)+'" fill="'+col+'" opacity=".55"/>';}
  var step=Math.max(1,Math.floor((n-1)/4));
  for(var j=0;j<n;j+=step){var cx2=cX(j);
    s+='<line x1="'+cx2.toFixed(1)+'" x2="'+cx2.toFixed(1)+'" y1="'+vBase+'" y2="'+(vBase+3)+'" stroke="rgba(255,255,255,.2)"/>';
    s+='<text x="'+cx2.toFixed(1)+'" y="'+(H-3)+'" fill="#8f98a8" font-size="8.5" text-anchor="middle">'+fmtd(K[j][0])+'</text>';}
  return '<svg class="kline" viewBox="0 0 '+W+' '+H+'">'+s+'</svg>';}
function openCard(d){
  const sc=SECTORS[d.sector];
  const dims=Object.keys(DIMMAX).map(k=>{
    const v=(d.six&&d.six[k]!=null)?d.six[k]:0, mx=DIMMAX[k], pct=Math.round(v/mx*100), nm=k.replace(/\(\d+\)/,'');
    return '<div class="dim"><div class="dl"><span>'+nm+'</span><b>'+v+' / '+mx+'</b></div>'+
      '<div class="track-w"><div class="track-f" style="width:'+pct+'%"></div></div>'+
      '<div class="subbars">'+((d.sub&&d.sub[k])||[]).map((p,i)=>{var it=p[0],v=p[1],mx=p[2]||1,pct=Math.max(3,Math.round(v/mx*100));return '<div class="sbcol" style="flex:'+mx+'" title="'+it+' · 实际 '+v+' / 满分 '+mx+'"><div class="sbbar"><i style="width:'+pct+'%;--c:'+SUBC[i%SUBC.length]+'"></i></div><div class="sbmeta"><b>'+v+'</b>/'+mx+' '+it+'</div></div>';}).join('')+'</div>'+
      '<div class="subcap">'+((d.sub&&d.sub[k])?'二级实际得分 · 填充＝得分/满分、数字＝'+(d.sub_scorer||'')+' 实际分/满分':'该腿无子项分（仅维度总分）')+'</div></div>';
  }).join('');
  const facts=Object.keys(FACTKEY).filter(k=>d.facts&&d.facts[k]!=null&&d.facts[k]!==''&&d.facts[k]!=='—').map(k=>{
    let val=d.facts[k]; if(typeof val==='number'&&!Number.isInteger(val)) val=Math.round(val*100)/100;
    return '<div><span class="fk">'+FACTKEY[k]+'</span><span class="fv">'+val+'</span></div>';
  }).join('');
  const finS=d.six&&d.six['财务健康与风险(5)'];
  const finWarn=(typeof finS==='number'&&finS<=FIN_MAX)?' <span class="warn">⚠ 财务维不健康 '+finS+'/5</span>':'';
  const hist=(d.hist&&d.hist.length>1)?'<div class="h"><span>Track</span><span class="cn">评分轨迹</span></div><div class="hist">'+d.hist.map(h=>'<span>'+h[0]+' · '+(h[1]??'—')+(h[2]?' <span class="sk">'+h[2]+'</span>':'')+'</span>').join('')+'</div>':'';
  const kl=(d.kline&&d.kline.length)?'<div class="h"><span>Price</span><span class="cn">近20交易日 K线（含成交量）</span></div>'+klineSVG(d.kline)+'<div class="subcap">红涨绿跌 · 纵轴＝相对首日收盘 %（0% 虚线）· 上K线 / 下成交量 · Market-Data 日线</div>':'';
  panel.style.setProperty('--sc',sc); panel.style.setProperty('--rcol',RCOL[d.rating]||'#D6DEE8');
  panel.innerHTML='<span class="close" onclick="closeP()">✕</span>'+
    '<h3>'+(d.hold?'<span class="cc"><span class="hd" style="display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--moon);margin-right:7px;box-shadow:0 0 6px var(--moon)"></span></span>':'')+d.name+'</h3>'+
    '<div class="pcode">'+d.ts+' · 分析日 '+(d.date||'')+(d.scorer?' · '+d.scorer:'')+(d.hold&&d.since?' · 持仓（'+d.since+'建仓）':'')+'</div>'+
    '<div class="ptags"><span class="indtag" style="--sc:'+sc+'">'+(d.seglabel||d.sector)+'</span>'+
    (d.track?'<span class="indtag" style="--sc:#B39DFF">'+d.track+'</span>':'')+'</div>'+
    '<div class="pscore"><span class="big" style="--rcol:'+(RCOL[d.rating]||'#D6DEE8')+';color:'+(RCOL[d.rating]||'#D6DEE8')+'">'+(d.total??'—')+'</span><span class="of">/ 100 · '+d.rating+'</span></div>'+
    '<div class="h"><span>Six Forces</span><span class="cn">六维拆解</span></div>'+dims+
    (facts?'<div class="h"><span>Engine</span><span class="cn">引擎实测（财务/估值）</span>'+finWarn+'</div><div class="facts">'+facts+'</div>':'')+
    '<div class="h"><span>Thesis</span><span class="cn">一句话判断</span></div><div class="thesis">'+(d.thesis||'—')+'</div>'+hist+kl;
  panel.classList.add('open'); scrim.classList.add('open');
}
function closeP(){ panel.classList.remove('open'); scrim.classList.remove('open'); }
scrim.addEventListener('click',closeP);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeP();});
render();
</script></body></html>
